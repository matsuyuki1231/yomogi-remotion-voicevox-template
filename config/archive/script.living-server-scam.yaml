# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 怪しい勧誘・詐欺疑い型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「怪しい勧誘・詐欺疑い」型（前半で緊張→後半で落ち着かせて宣伝）
#   めたんが「無料で始めて自分の店で稼げる場所がある」とずんだもんを勧誘 →
#   ずんだもんが「絶対詐欺なのだ！」と全力で警戒し、詐欺メーターが赤く上昇（前半＝緊張・茶番）。
#   後半、めたんが実映像で証拠を出すと "うまい話" が一つずつ「本当でした」と証明され、
#   詐欺メーターが0まで下降 → 正体は「よもぎサーバーの生活サーバー」だったとリビール
#   （後半＝落ち着き・宣伝）。締めは「"詐欺だと思った"人コメントで」でループ＆コメント誘発。
#
# ■ 視聴維持の装置
#   1. 詐欺メーター（ScamMeter）… 前半で赤く上昇＝「もう詐欺確定寸前」の緊張。証拠で緑に下降し安堵
#   2. うまい話カード / 詐欺警告スタンプ … めたんの勧誘とずんだの警戒が1カットずつ殴り合う茶番
#   3. 「本当でした」検証スタンプ … 疑いが実映像で覆る快感。ギャップが宣伝への転換を自然にする
#
# ■ 構造上のルール
#   - 前半（id1〜6）: pitch（うまい話カード）とalert（詐欺警告）を交互に。メーターを 25→95 まで上げる
#   - 転換（id7）: BGMを不穏→温かいに切替。ここから証拠フェーズ。メーターが急降下する
#   - 後半（id7〜11）: proof（本当でした）で各うまい話を実映像で証明。メーターを 60→0 へ
#   - リビール（id10）で初めてサーバー名。id11で「参加費0円・24時間」を念押し
#   - CTA（id12）→ 結果リボン（id13, pauseAfter:0）で冒頭にループ
#   - サーバー側の事実（無料・24時間・土地/家/店/会社/釣り275種/車）だけを docs/yomogi で裏取り
#   - メーターの色は 50%超で赤・50%以下で緑。ScamHud が直前の値からアニメで動かす
#
# ■ 情報ソース: docs/yomogi 配下
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 生活ワールドに土地を購入して自分だけの家や店を建てられる（intro.md）
#   - チェストショップで自分のアイテムを販売できる／会社経営ができる（intro.md, company.md）
#   - 釣りで釣れる魚は275種類／車に乗って生活ワールドを駆け回れる（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: anxiety_piano / data_analysis / item-get1 / boom / jajean1 は効果音ラボ等（商用可・クレジット不要）


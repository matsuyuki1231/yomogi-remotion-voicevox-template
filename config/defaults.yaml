# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_picopicodisco.mp3"
  volume: 0.18
  loop: true
  # テレビショッピング・通販型:
  # 前半（商品発表〜セット連発〜値段引っぱり）はハイテンションなディスコで
  # 深夜通販の勢いを作り、値段発表（id:9）で穏やかな曲に切り替えて
  # 「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「ピコピコディスコ」— ハイテンションな電子ディスコ。通販の勢いに合わせる
    - src: "amacha_picopicodisco.mp3"
      volume: 0.18
      loop: true
      fromLineId: 1
    # 「ゆるやかな朝焼け」— 穏やかな曲。0円発表の解放感〜宣伝パートに切り替える
    - src: "amacha_yuruyakanaasayake.mp3"
      volume: 0.2
      loop: true
      fromLineId: 9

# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_spadenoheitai.mp3"
  volume: 0.17
  loop: true
  # 裁判・尋問型:
  # 前半（開廷〜証拠フェーズ）は緊迫した行進曲で法廷の張りつめた空気を作り、
  # 判決（id:11）で明るい曲に切り替えて「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「スペードの兵隊」— 激しい行進曲。開廷〜尋問の緊張に合わせる
    - src: "amacha_spadenoheitai.mp3"
      volume: 0.17
      loop: true
      fromLineId: 1
    # 「ハッピータイム」— 明るいアンサンブル。無罪判決の解放感〜宣伝パートに切り替える
    - src: "amacha_happytime.mp3"
      volume: 0.2
      loop: true
      fromLineId: 11

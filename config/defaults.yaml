# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_sanjinooyatsu.mp3"
  volume: 0.18
  loop: true
  # 縦型ショートドラマ・逆転劇型（人狼版 script.werewolf-drama.yaml 用）:
  # 前半（疑いの根拠が積まれ、吊り間違えるまで）は不穏な曲で緊張を作り、
  # 空気が反転する id:19 で明るい曲に切り替えて「ぜんぶゲームだった」の解放を音でも作る
  #
  # ※版を切り替えたら、この segments も版に合わせて差し替えること
  #   生活サーバー版（script.living-server-drama.yaml）:
  #     amacha_metropolis 0.16 / fromLineId 1
  #     amacha_yuruyakanaasayake 0.2 / fromLineId 18
  segments:
    # 「テクノフォビア」— 不穏。疑心暗鬼〜吊り間違いまでの前半に合わせる
    - src: "amacha_technophobia.mp3"
      volume: 0.16
      loop: true
      fromLineId: 1
    # 「ハッピータイム」— 明るい。「ぜんぶゲームなのだ」の解放〜宣伝パートに切り替える
    - src: "amacha_happytime.mp3"
      volume: 0.2
      loop: true
      fromLineId: 19

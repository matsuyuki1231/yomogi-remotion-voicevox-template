# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_sanjinooyatsu.mp3"
  volume: 0.18
  loop: true
  # 縦型ショートドラマ・逆転劇型:
  # 前半（見下されながら事実が積まれていくパート）は都会的でクールな曲にして
  # 「淡々と立場が削れていく」緊張を作り、逆転（id:14）で穏やかな曲に切り替えて
  # 「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「メトロポリス」— 都会的でクール。見下し〜事実が積まれる前半に合わせる
    - src: "amacha_metropolis.mp3"
      volume: 0.16
      loop: true
      fromLineId: 1
    # 「ゆるやかな朝焼け」— 穏やか。逆転〜宣伝パートに切り替える
    - src: "amacha_yuruyakanaasayake.mp3"
      volume: 0.2
      loop: true
      fromLineId: 18

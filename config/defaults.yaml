# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_sanjinooyatsu.mp3"
  volume: 0.18
  loop: true
  # 路線図・車内アナウンス型（script.living-server-rail.yaml 用）:
  # 走行パート（id1〜25）は移動感のある曲で各駅を駆け抜け、
  # 終点で運賃が0円に確定する id:26 で明るい曲に切り替えて
  # 「着いた」空気に変える
  #
  # ※版を切り替えたら、この segments も版に合わせて差し替えること
  #   路線図・車内アナウンス型（script.living-server-rail.yaml）:
  #     amacha_metropolis 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 26
  #   参加導線ハウツー型・生活サーバー版（script.living-server-join.yaml）:
  #     amacha_marbletechno1 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 12
  #   正直CM・王道PR型（script.living-server-promo.yaml）:
  #     amacha_picopicodisco 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 19
  #   クイズ$ミリオネア型（script.living-server-millionaire.yaml）:
  #     amacha_marbletechno1 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 19
  #   画面当てクイズ型・人狼版（script.werewolf-screenquiz.yaml）:
  #     amacha_picopicodisco 0.15 / fromLineId 1
  #     amacha_happytime 0.19 / fromLineId 17
  #   画面当てクイズ型・生活サーバー版（script.living-server-screenquiz.yaml）:
  #     amacha_picopicodisco 0.15 / fromLineId 1
  #     amacha_happytime 0.19 / fromLineId 20
  #   巻き戻し型（script.living-server-rewind.yaml）:
  #     amacha_solarisnoame 0.16 / fromLineId 1
  #     amacha_yuruyakanaasayake 0.2 / fromLineId 20
  #   リスポーン型（script.living-server-respawn.yaml）:
  #     amacha_solarisnoame 0.16 / fromLineId 1
  #     amacha_yuruyakanaasayake 0.2 / fromLineId 19
  #   求人票・募集要項型（script.living-server-job.yaml）:
  #     amacha_marbletechno1 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 19
  #   縦型ショートドラマ型・生活サーバー版（script.living-server-drama.yaml）:
  #     amacha_metropolis 0.16 / fromLineId 1
  #     amacha_yuruyakanaasayake 0.2 / fromLineId 18
  #   縦型ショートドラマ型・人狼版（script.werewolf-drama.yaml）:
  #     amacha_technophobia 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 19
  #   認定試験・答案採点型（script.living-server-exam.yaml）:
  #     amacha_marbletechno1 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 29
  #   相場クイズ・値札当て型（script.living-server-market.yaml）:
  #     amacha_metropolis 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 28
  #   ウソ発見器・ウソ当て型（script.living-server-lie.yaml）:
  #     amacha_technophobia 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 26
  #   ウソ発見器・ウソ当て型／人狼版（script.werewolf-lie.yaml）:
  #     amacha_technophobia 0.16 / fromLineId 1
  #     amacha_happytime 0.2 / fromLineId 25
  segments:
    # 「テクノフォビア」— 測定パート。計器が回っている無機質さ
    - src: "amacha_technophobia.mp3"
      volume: 0.16
      loop: true
      fromLineId: 1
    # 「ハッピータイム」— 事実リストが出てトーンが金に反転する行から
    - src: "amacha_happytime.mp3"
      volume: 0.2
      loop: true
      fromLineId: 25

# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_metropolis.mp3"
  volume: 0.17
  loop: true
  # 緊急速報・報道型:
  # 前半（速報〜現場中継）は暗く緊迫したダークテクノで報道の緊張を作り、
  # リビール（id:8）で温かい曲に切り替えて「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「メトロポリス」— 暗く緊迫したダークテクノ。謎の巨大都市＝速報パートに合わせる
    - src: "amacha_metropolis.mp3"
      volume: 0.17
      loop: true
      fromLineId: 1
    # 「緩やかな朝焼け」— 穏やかでほのぼの。事件じゃなかったと分かる〜宣伝パートの安堵に切り替える
    - src: "amacha_yuruyakanaasayake.mp3"
      volume: 0.22
      loop: true
      fromLineId: 8

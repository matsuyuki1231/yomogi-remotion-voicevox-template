# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_sanjinooyatsu.mp3"
  volume: 0.18
  loop: true
  # 街頭インタビュー・突撃取材型:
  # 前半（1人ずつ聞いて回るパート）はバラエティのロケVTRらしい軽い曲で
  # 「次は何が出てくるのか」のテンポを作り、取材終了＝0円（id:14）で
  # 穏やかな曲に切り替えて「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「三時のおやつ」— 軽快でコミカル。街を回って聞き込むテンポに合わせる
    - src: "amacha_sanjinooyatsu.mp3"
      volume: 0.18
      loop: true
      fromLineId: 1
    # 「ゆるやかな朝焼け」— 穏やか。0円＝取材終了の解放感〜宣伝パートに切り替える
    - src: "amacha_yuruyakanaasayake.mp3"
      volume: 0.2
      loop: true
      fromLineId: 15

# デフォルト値設定

newLine:
  character: tsumugi
  pauseAfter: 15
  durationInFrames: 60
  scene: 1
  emotion: null

automation:
  # 保存時に音声を自動生成（VOICEVOXが起動している場合）
  voiceOnSave: false
  # voiceFileを自動命名（{id}_{character}.wav）
  autoVoiceFileName: true

bgm:
  # フリーBGM（商用可・クレジット任意・コンテンツID登録不可）
  # segments を指定した場合はそちらが優先される（src は未指定時のフォールバック）
  src: "amacha_marbletechno1.mp3"
  volume: 0.18
  loop: true
  # コメント返信・反論処理型:
  # 前半（煽りコメント〜質問を潰していくパート）は硬質なテクノで
  # 「未回答があと何件」の緊張を作り、回答完了（id:14）で穏やかな曲に
  # 切り替えて「後半は落ち着かせて宣伝」の転換を音でも作る
  segments:
    # 「マーブルテクノⅠ」— テクノ・エレクトロ。質問を潰していくテンポに合わせる
    - src: "amacha_marbletechno1.mp3"
      volume: 0.18
      loop: true
      fromLineId: 1
    # 「ミルキーウェイ」— ヒーリング。0円＝回答完了の解放感〜宣伝パートに切り替える
    - src: "amacha_milkyway.mp3"
      volume: 0.2
      loop: true
      fromLineId: 14

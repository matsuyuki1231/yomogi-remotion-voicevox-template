# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 裁判・尋問型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「裁判・尋問型」（前半で緊張→後半で落ち着かせて宣伝）
#   「被告人はマイクラの中で会社を経営していると証言」という一文で開廷する法廷茶番。
#   検察官（めたん）が「そんなわけがない＝ホラ吹きの疑い」で起訴し、被告人（ずんだもん）が
#   証拠映像を1つずつ提出していく。証拠が採用されるたびに「事実」と認定され、
#   常設の《有罪の心証》メーターが 98% から削られていく（前半＝緊張・茶番）。
#   最終尋問「参加費はいくら？」→「0円」で心証0%、判決は無罪。
#   ここで法廷トーンを解除し、正体＝よもぎサーバーの生活サーバーだと明かして
#   穏やかな機能紹介＋検索CTAへ着地する。締めは「次の被告人は、あなた」でループ。
#
# ■ 視聴維持の装置
#   1. 法廷UI（CourtChrome）… 公判中ランプ・速記録ティッカー・木の羽目板が常時動き続ける。
#      判決以降は臙脂「公判中」→緑「閉廷」に変わり、画面全体でトーンダウンを見せる
#   2. 有罪の心証メーター … 98→80→58→36→18→0 と1本の線で減っていく。
#      「0%になったら何が起きるのか」を見届けたくなるので、最後まで引っぱれる
#   3. 証拠プレート＋「事実」認定スタンプ … 1カット1証拠。字幕の代わりに読ませる
#   4. 好奇心ギャップ …「どこの世界の話なのか」を判決後のリビールまで明かさない
#
# ■ 構造上のルール
#   - 前半（id1〜10）: courtTone は trial。ヘッダは臙脂、赤いビネットが脈打つ
#   - 転換（id11）: 判決スラム「無罪」で courtTone を verdict に。ここでBGMも切替（defaults.yaml）
#   - リビール（id12）で初めてサーバー名。id13 で機能、id14 で検索CTA
#   - 結果リボン（id15, pauseAfter:0）で冒頭にループ
#   - id1 と id15 は同じ映像・同じ startFrom（ループがつながる）
#   - 字幕は検索CTA（id14）の行だけ。ほかの行は証拠プレート・テロップがテロップを兼ねる
#   - courtTicker は全行ぶんを1本の速記録に連結して常時流す（Main が集約）
#   - サーバー側の事実（無料・24時間・統合版・土地/家/店/会社/釣り275種/車）は docs/yomogi で裏取り
#
# ■ 情報ソース: docs/yomogi 配下
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 生活ワールドに土地を購入して自分だけの家や店を建てられる（intro.md, land-protection.md）
#   - 会社プラグインで会社経営ができ、帳簿・社員一覧・銀行がある（company.md）
#   - チェストショップ＝保護した土地に置ける簡易的な無人販売所（chest-shop.md）
#   - 釣りで釣れる魚は275種類／車に乗って生活ワールドを駆け回れる（intro.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: hyoushigi1 / ban1 / shock1 / correct1 / question1 / tympani-roll1 / don-1 /
#         people-shout-oo2 / people-performance-cheer1 / jajean1 / item-get1 / 決定ボタンを押す4
#         はいずれも効果音ラボ（商用可・クレジット不要）


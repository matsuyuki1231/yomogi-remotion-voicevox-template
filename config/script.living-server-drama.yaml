# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 縦型ショートドラマ・逆転劇型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「縦型ショートドラマ・逆転劇型」（前半はドラマで釣り、後半で宣伝）
#   2026年のショート動画でいちばん伸びているのは「縦型ショートドラマ（micro-drama）」。
#   60〜90秒で完結する自己完結ドラマで、ジャンルは復讐・ざまぁ・どんでん返しが強い。
#   これまでの型（報道・裁判・通販・コメント欄・街頭インタビュー）が
#   すべて「パロディUI＋茶番」だったのに対し、この型の核は**人間関係と感情の反転**にある。
#
#   物語は一直線。めたんが「まだマイクラなんてやってるの？」と見下すところから始まり、
#   ずんだもんが淡々と事実（会社／社員6人／無人の店／釣り275種／家／車／近距離VC）を
#   並べていくたびに立場が削れていき、最後にめたんが「私、なにも持ってない」と折れる。
#   その直後に「それ、どこでできるの？」が出るので、宣伝が押し売りにならない。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. micro-drama（縦型ショートドラマ）が2026年の主流。冒頭5秒フック →
#      30秒で加速 → 45秒で反転 → 末尾でクリフハンガー、というビートで書く
#   2. 50〜60秒のShortsが最も完視聴率が高い（76%）。短くするより情報密度で持たせる
#   3. テロップ付き動画は音声のみより視聴維持が25%高い → 全行にドラマ字幕を出す
#   4. 冒頭2秒で掴めなければ負け → 1行目をいちばん強い煽りセリフにする
#   5. ループ再生も再生回数に加算される → 最終行の映像は1行目と同じ src / startFrom
#
# ■ 画面が物語を説明してはいけない（重要）
#   初版には《逆転まで 00:34》のカウントダウン帯と「この後、立場が入れ替わります」の
#   一文を常設で置き、シークバーには逆転ポイントの ◆ マーカーを、逆転の行には
#   「立場、逆転」のスラムを出していたが、これらは物語の外側から
#   「これから逆転が起きます」「いま逆転しました」と実況してしまうもので、
#   ドラマの枠組みが露出して「胡散臭い作り話」に見えてしまう。すべて撤廃済み。
#   **逆転は暗示的に起こすこと**。転換点の行もほかと同じセリフ字幕だけを出し、
#   カラーグレードの反転・ごく短い白フラッシュ・BGMの切り替えだけで空気の変化を伝える。
#   ほかの型（心証メーター・未回答件数・値札・取材ドット）は茶番なので説明してよいが、
#   ドラマだけは別だと考えること。
#
# ■ 視聴維持の装置
#   1. 事実チップ列（dramaFact）… 会社→店→魚275種→家→車→0円 と積まれ、
#      立場の差が目に見えて開いていく。**1行に収まるよう6個・短い語まで**にする。
#      この型で唯一の常設メーターで、結末は予告せず「差が開いていく」だけを見せる
#   2. ヘッダのエピソードタイトル … 答えの出ていない問いかけをそのまま置く
#   3. シークバー（最下部）… 配信アプリ風の進行表示。残りが見えるので離脱しにくい
#   4. カラーグレード … 前半は冷たい青、逆転後は暖色（DramaScrim がトーンで切り替える）
#   5. ドラマ字幕 … ほかの型と違い、この型では字幕そのものが主役
#
# ■ 構造上のルール
#   - id1 はいちばん強い煽り（dramaJab）。前置きゼロ、いきなり「転」から始める
#   - 転換（id18）: dramaTone を turn にした行から青→金に反転し、ごく短い白フラッシュが入る。
#     BGMもここで切り替える。**転換点であることを文字では一切説明しない**（セリフ字幕だけ）
#   - id19「それ、どこでできるの？」が宣伝への導線。視聴者の疑問を代弁する形にする
#   - 次回予告リボン（id24, pauseAfter:0）で冒頭にループ。id1 と id24 は同じ映像・同じ startFrom
#   - dramaJab / dramaFlash / dramaReveal / dramaResult がある行は
#     そのテロップが字幕を兼ねるので dramaLine を書かない。それ以外の行には必ず書く
#   - 登場人物・エピソードはフィクション。id23 の注記で明示する
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 情報ソース: docs/yomogi 配下（ずんだもんの発言はすべてここで裏取り）
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 会社制度で本格的な会社経営ができる。社長は1人、社員数に制限なし（intro.md, company.md）
#   - チェストショップ＝保護した土地に置ける無人販売所（intro.md, chest-shop.md）
#   - 釣りで釣れる魚は275種類（intro.md）
#   - 土地を購入して自分だけの家や店を建てられる（intro.md, land-protection.md）
#   - 車に乗って生活ワールドを駆け回れる（intro.md）
#   - 近距離VCで近くの人としゃべれる（intro.md, limited-vc.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: text-impact1 / 決定ボタンを押す1〜4 / shock1 / item-get1 / correct1 /
#         people-shout-oo2 / anxiety_piano / don-1 / drum-roll1 / jajean1 / sceneswitch1
#         はいずれも効果音ラボ（商用可・クレジット不要）


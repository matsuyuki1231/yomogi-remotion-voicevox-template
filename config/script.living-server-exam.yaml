# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 認定試験・答案採点型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「認定試験・答案採点型（EXAM）」よもぎ生活鯖 認定試験
#   既存のクイズ型2つ（画面当てクイズ型 / クイズ$ミリオネア型）は
#   どちらも**クイズが主役で、機能の説明は正解の根拠1行だけ**だった。
#   紹介できる要素が「1問＝1フレーズ」に圧縮されるので、
#   よもぎ生活鯖のいちばん濃い部分（会社制度・下限価格規制・役職の単価）が
#   どうしても入りきらない。
#
#   この型はそこを反転させる。**クイズはつかみ、解説が本体**。
#   1問ごとに答案用紙の下半分が丸ごと「解説パネル」に変わり、
#   見出し＋補足2行＋**出典（docsのページ名）**まで出す。
#
# ■ この型の芯
#   「全問正解できたら、あなたはもう住人です」。
#   解けた人は"知っている人"として気持ちよく、解けなかった人には
#   **知らない機能がまだあること自体が宣伝になる**。どちらに転んでも刺さる。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「認定試験、スタート」と
#      いきなり試験が始まる。1行目で視聴者が受験者にされる
#   2. 常設の"あと何"メーター … 得点（0→100点）と合格ライン70点のマーカー。
#      Q7（釣り275種）で合格ラインを越えてメーターが金に変わる
#   3. 1カット1情報 … 1問1機能。すべて docs/yomogi で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … 検定のパロディUIなので、得点も合格ラインも
#      画面が明示するのが本体（ドラマ型とは逆）
#   6. ティッカーなし … 2026年8月5日の方針変更で、流れる要約帯は作らない
#
# ■ 構造上のルール
#   - 設問文は**14文字以内**（1行に収める。2行に折ると選択肢に食い込む）
#   - 選択肢は10文字以内が安全
#   - 解説の見出しは2行まで、補足は2行まで
#   - 出題行と解答行の両方に examChoices を書く（解答行は正解だけ残す）
#   - 認定証（id29）でトーンが pass に変わり、答案用紙が畳まれる
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   役職制度（living/commands/role.md）… 石2YG／鉄5YG／金5YG／ラピス7YG／
#     レッドストーン3YG／ダイヤ20YG。役職変更は無料・クールタイムなし
#   最低販売価格（living/supplement/minimum-price.md）… 鉄300YG／
#     ダイヤ2300YG／小麦3YG。産業保護のための下限価格規制
#   土地保護（living/commands/land-protection.md）… 生活ワールドは100/m^2
#   チェストショップ（living/commands/chest-shop.md）… 無人販売所。
#     2025年5月15日から遠隔購入も可能。収益の7%が手数料
#   会社（living/commands/company.md）… 社長は1人、課長と社員は人数制限なし。
#     帳簿・銀行あり。設立は無料（審査あり）
#   公認企業制度（living/supplement/good-standing-company.md）… 時給5,000YG以上・
#     ノルマは週3時間まで・道具代は会社負担・面接でため口禁止
#   はじめに（intro.md）… 釣り275種類／統合版／参加費無料／24時間
#   島（living/commands/island.md）… 作成に3,000,000YG。拡張5回で200×200
#   近距離VC（living/commands/limited-vc.md）… 距離で音量が変わる
#
# 素材: public/content/生活サーバー 配下
# 効果音: 効果音ラボ（商用可・クレジット不要）


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / スリーヒント・独自機能図鑑型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「スリーヒント・独自機能図鑑型（HINT）」よもぎ生活鯖 スリーヒントクイズ
#   裁定クイズ型が「制度・裁定」を当てさせたのに対し、この型は
#   **独自機能そのもの**を当てさせる。具体的なスペック3つをヒントとして
#   1枚ずつ積み、「これ、なんでしょう？」で機能名を当てさせる。
#   当てた機能は**図鑑に1件ずつ収まっていく**（0→8件）。
#
# ■ この型の芯
#   **「ヒントが具体的すぎる」**。ふつうの連想クイズのヒントは抽象的だが、
#   この型のヒントは「1秒4YG」「小麦の俵12個で1枚」「代金は170%」のような
#   **仕様の数字そのもの**。ヒントを読み上げるだけで紹介が終わっている——
#   当てさせる動作と紹介する動作が同じになるのがこの型の効率。
#   最終問題だけは**ヒントが1つ**（「0円」）で、即答できること自体が
#   参加費の宣伝になる。
#
# ■ 8問の構成（すべて docs/yomogi で裏が取れる独自機能）
#   1 エレベーター … 鉄ブロック+感圧板 / ジャンプで上 / ダイヤ製は上下50m
#   2 有人レジ … 店番のいるレジ / 設置500YG / 手数料0%
#   3 ガチャ … チケット1枚 / 小麦の俵12個で1枚 / 確率ぜんぶ公開
#   4 称号 … 名前の横の肩書き / 自作5000YG / 色で入手方法が分かる
#   5 遠隔購入 … 家から買える / 代金170% / 検索機能はわざと無い（設計思想）
#   6 チェスト保護 … チェストの鍵 / パスワード対応 / 無料
#   7 島 … 自分だけのワールド / 300万YG / 最大200×200
#   8 参加費 … 「0円」だけ（ヒント1つで即答）
#   いちばん濃いのは第5問（遠隔購入）。機能の有無ではなく、
#   スポーン近くの土地の価値を守るために**検索機能をわざと作らなかった**という
#   運営の設計思想が出る。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「暗視をレンタルすると、1秒4YGなのだ」
#   2. 常設の"あと何"メーター … 図鑑 0 → 8
#   3. 1カット1情報 … 1ヒント＝1仕様
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … 図鑑のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#
# ■ 構造上のルール
#   - ヒントカード（hintCards）は**15文字以内**（1行に収める）。3枚まで
#   - 出題行と解答行の両方に hintCards / hintAnswer を書く
#   - **出題行では中立な街の映像、解答行で機能の映像**を当てる
#     （出題中に答えの画が映るとネタバレになる）
#   - 出題行のセリフは「ひとつめ〜ふたつめ〜みっつめ〜」で3ヒントを読み上げる
#     （＝シンキングタイム。カードはセリフに合わせて時間差で積まれる）
#   - 図鑑の行（hintRowName / hintRowNote）は 機能名12文字以内・ひとこと11文字以内
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   問番号は「第2問」〜「第6問」「第8問」を**カタカナ**（ダイニモン〜ダイハチモン）、
#   「第1問」「第7問」を**ひらがな**（だいいちもん / だいななもん）。
#   「感圧板」は**ひらがな（かんあつばん）**。金額は 半角数字＋ワイジイ。
#   「正解」は**せいかい**とひらがなで書く（漢字でも読めるが統一）。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   エレベーター（living/commands/elevator）… 鉄ブロック+鉄の重量感圧板。
#     ジャンプで上・スニークで下。間隔3〜8マス。ダイヤブロック製は上下50m
#   有人レジ（living/commands/staffed-register）… 設置500$・販売手数料なし。
#     アイテムは店員が手渡し（お金のやりとりだけ代行）
#   ガチャ（living/commands/gacha）… チケット交換は 1200YG=1枚 / 小麦の俵12個=1枚 /
#     ラピスブロック1個=1枚 など。昼限定ガチャは11〜15時でチケット2枚。
#     排出確率と排出実績を公開（サーバー全体と個人の両方）
#   称号（living/commands/rank）… 自作5000YG。太字斜体は作成不可。
#     [] の色が入手経路（白=自作 / オレンジ=看板 / 水色=アスレチック / 紫=イベント / 黄緑=ミッション）
#   遠隔購入（living/commands/chest-shop・supplement/chest-shop）… /csbuy で遠隔購入。
#     代金は170%（うち70%が手数料）。検索機能は**わざと実装していない**
#     （スポーン近くの土地の価値を守るため）
#   チェスト保護（living/commands/chest-protection）… /clock で施錠・無料。
#     /cpasslock でパスワード付き（知っている人は全員開けられる。マンション経営向け）
#   島（living/commands/island）… 作成3,000,000YG。拡張5段階で費用1.5倍ずつ、
#     最大200×200。削除は復元不可・返金なし
#   参加（living/how-to-join、faq/device）… 統合版・参加費0円・24時間


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 街頭インタビュー・突撃取材型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「街頭インタビュー・突撃取材型」（前半は取材VTRの顔で釣り、後半で宣伝）
#   画面がまるごと「ロケVTR」になる。REC ランプ・タイムコード・四隅のビューファインダー
#   マーカーが常時動き、映像には手持ちカメラの揺れがかかる（Main が handheld を渡す）。
#
#   この型の核は「映像はマイクラなのに、聞こえてくる会話は完全に現実の街頭インタビュー」
#   というズレ。1行目の質問「いま、何してたんですか？」に対する答えが
#   「会社の決算。社員が6人いる」なので、視聴者は何を見せられているのか分からないまま
#   引き込まれる（＝1秒フック）。以降は1人1カットで答えがどんどんおかしくなる。
#
#   常設の《取材 n人目》ドット列は7個あり、6人目まで埋まったところで止まる。
#   「7人目は誰なんだ」という open loop を冒頭から張り、最終行で
#   「7人目は、あなた」と視聴者に向けて回収する（ループとコメント誘発を同時に満たす）。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 冒頭1秒は「起」ではなく「転」。前置きゼロで、いきなり質問と回答のズレをぶつける
#   2. 3秒ごとに新情報。1人1カット＝1情報なので構造的に密度が保たれる
#   3. コメントを誘発する「隙」を企画段階で設計する
#      → 最終行の「あなたは、いま何してた？」がそのまま隙になる
#   4. 予想外の展開とギャップ。取材VTRだと思って見ていたら宣伝に着地する
#   5. ループ再生も再生回数に加算される → 最終行の映像は1行目と同じ src / startFrom
#
# ■ 視聴維持の装置
#   1. ビューファインダーUI（InterviewChrome）… RECランプの明滅、進み続ける
#      タイムコード、手ブレする四隅マーカー、カチンコ柄の取材メモ帯
#   2. 取材カウンター＋ドット列（intvCount）… 1人目→7人目。最後の1個が
#      空いたまま残るので「7人目は誰？」で最後まで引っぱれる
#   3. 回答者プレート＋極太テロップの2枚組。1人1カットで別人だと分かる
#   4. 好奇心ギャップ …「この人たちは何者で、この街はどこにあるのか」を id16 まで伏せる
#
# ■ 構造上のルール
#   - 前半（id1〜14）はサーバー名を出さない。「どこの世界の話なのか」で引っぱる
#   - 転換（id14）: 「0円」の取材終了スラムで intvTone を wrap に。ここでBGMも切り替える
#   - id15 の「この街、どこにあるの？」が宣伝への導線。視聴者の疑問を代弁する形にする
#   - 結果リボン（id18, pauseAfter:0）で冒頭にループ。id1 と id18 は同じ映像・同じ startFrom
#   - 字幕は検索CTA（id17）の行だけ。ほかの行は質問吹き出し・回答テロップが兼ねる
#   - intvTicker は全行ぶんを1本に連結して常時流す（Main が集約）
#   - 回答者は全員架空。実在の街頭インタビューだと誤認させないよう id17 の注記で明示する
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと。
#     開始位置＋そのセリフの尺が素材の終端を越えると、カット後半が静止・黒コマになる
#
# ■ 情報ソース: docs/yomogi 配下（回答はすべてここで裏取り）
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 会社制度で本格的な会社経営ができる（intro.md, company.md）
#   - チェストショップ＝自分のアイテムを売れる無人販売所（intro.md, chest-shop.md）
#   - 釣りで釣れる魚は275種類（intro.md）
#   - 採掘・農業・木こり・釣りができ、作業勢にもおすすめ（intro.md）
#   - 車に乗って生活ワールドを駆け回れる（intro.md）
#   - 近距離VCで近くの人としゃべれる（intro.md, limited-vc.md）
#   - 土地を購入して自分だけの家や店を建てられる（intro.md, land-protection.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: text-impact1 / shock1 / 決定ボタンを押す1 / item-get1 / question1 /
#         correct1 / 決定ボタンを押す3 / people-shout-oo2 / drum-roll1 / don-1 /
#         決定ボタンを押す2 / jajean1 / 決定ボタンを押す4
#         はいずれも効果音ラボ（商用可・クレジット不要）


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 求人票・募集要項型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「求人票・募集要項型」（前半はマイクラを一切見せずに釣り、後半で宣伝）
#   これまでの型（報道・裁判・通販・コメント欄・街頭インタビュー・ドラマ）に
#   共通していた構造的な前提は「1フレーム目からマイクラの実映像が出ている」ことだった。
#   この型はそこを壊す。**前半（id1〜18）はマイクラ映像を1枚も出さず、
#   白い求人サイトの画面だけで進む。** 視聴者は最後まで「マイクラの動画」だと思わない。
#
#   id19「日本には、ないのだ」で**求人票が縦に裂け**、その裂け目から実映像が現れる。
#   前半で一度もマイクラを見せていないぶん、ここの落差が全部の効きどころになる。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 「意外な事実型（雑学・知識系）」＝他人に教えたくなる情報を出典つきで並べ、
#      コメント欄の議論を誘発する型が強い。条項ごとに出典（第○条）を出すのはこのため
#   2. 45〜75秒・高情報密度。3秒ごとに新しい情報を出し続ける（＝1カット1条項で12連発）
#   3. 冒頭1秒は「起」ではなく「転」。前置きゼロで、いちばん異常な条項をそのまま1行目に置く
#   4. ループ再生も再生回数に加算される → 最終行のあと冒頭の白い求人票に戻る落差でループ
#   5. コメント誘発を構造に埋める → 最終行「あなたの職場、この条件ある？」
#
# ■ この型は「説明してよい」型
#   ドラマ型だけは物語をリアルだと信じてほしいので画面が説明してはいけないが、
#   この型は最初から求人サイトのパロディUIだと分かる茶番なので、
#   常設メーター（募集要項 n/12 とスクロールレール）で「あと何件あるのか」を
#   明示してよい。これが最後まで引っぱる装置になる。
#
# ■ 視聴維持の装置
#   1. 募集要項カウンター＋スクロールレール（jobNo）… 1/12 → 12/12。あと何件あるかが常に見える
#   2. 条項カード（jobTerm）… 1カット1条項で差し替わる。出典つきで信憑性を出す
#   3. ツッコミ吹き出し（jobRetort）… 4件ごとに挟んでリズムを作る。掛け合いの役割も兼ねる
#   4. 「YG」という謎の単位 … id3 で出して id4 で「なに？」と聞き、答えを後半まで引っぱる
#   5. 社名の伏せ字（株式会社 ███████）… 「どこの会社なのか」を最後まで伏せる
#
# ■ 構造上のルール
#   - 前半（id1〜18）は visual を書かない。実映像が1枚でも混ざるとこの型は成立しない
#   - 転換（id19）: jobTone を real にした行から背景が実映像に変わり、
#     求人票が裂けるアニメーションが入る。BGMもここで切り替える。
#     紙が開ききるまで間が要るので、この行だけ pauseAfter を正の値にする
#   - jobTerm / jobRetort / jobFlash / jobBreak / jobReveal / jobResult がある行は
#     そのテロップが字幕を兼ねるので字幕を出さない。字幕は検索CTA（id25）の行だけ
#   - 求人票そのものは演出なので、id25 の注記で明示する
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 情報ソース: docs/yomogi 配下（条項はすべてここで裏取り。創作した条項はひとつもない）
#   優良企業ガイドライン（docs/yomogi/living/supplement/good-standing-company.md）
#     - 第3条 3.13 ノルマを「週3時間」以上にしてはいけない
#     - 第7条 7.1 社員の事実上の時給が5,000YG以上になるよう努めなければならない
#     - 第5条 5.8 業務に必要となる費用（ツール代など）を社員に負担させてはいけない
#     - 第5条 5.1 故意・重過失によらない損害を社員に請求してはいけない
#     - 第5条 5.2 自己都合退職は理由のいかんにかかわらず拒否してはいけない
#     - 第5条 5.6 社員が副業を行うことを禁止してはいけない
#     - 第3条    労働条件通知書に賃金形態・給与額・解雇事由・締め日・仕事内容・ノルマを明記
#     - 第6条 6.1 ため口を使って面接をしてはいけない
#     - 第6条 6.4 採用試験の結果は合否にかかわらず伝える
#     - 第6条 6.6 / 第7条 7.2 活動歴によって採否・給与を差別してはいけない
#     - 第10条 10.4 最低販売価格の1.3倍を超える価格で販売してはいけない
#     - 第10条 10.3 新規ユーザーとの取引は24時間、理由を問わず返品に応じる
#     - 公認企業は月30,000YGの支援金を受け取れる（2か月に1度60,000YG）
#   会社プラグイン（docs/yomogi/living/commands/company.md）
#     - 会社は運営に申告すれば誰でも無料で設立できる。ただし一定の審査がある
#   はじめに（docs/yomogi/intro.md）
#     - 統合版・参加費無料・24時間・運営形態はボランティア
#
# 素材: public/content/生活サーバー 配下（後半のみ）
# 効果音: text-impact1 / 決定ボタンを押す1〜4 / question1 / shock1 / correct1 /
#         anxiety_piano / boom / don-1 / item-get1 / sceneswitch1
#         はいずれも効果音ラボ（商用可・クレジット不要）


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 参加導線ハウツー型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「参加導線ハウツー型（JOIN）」入り方、これだけ
#   既存26型はすべて「魅力を見せる → 最後の1行で『よもぎサーバーで検索』」で
#   終わっていた。CTAは動画のオマケで、実際に参加するかどうかは視聴者が
#   動画を閉じたあとの話だった。この型は**CTAそのものを動画の本体にする**。
#   前半は参加手順の実演（STEP 1〜5）、後半は入った直後にやることの案内で、
#   見ながらそのまま参加できる。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 手順動画なのに**結論（もう入れた画）から始める**。
#      id1 だけトーンが inside なので、映像がぼけずにクリアに出る
#   2. 常設の"あと何"メーター … 前半は STEPバー（1→5）、後半は
#      やったことチップ。さらに**経過時間カウンターは演出ではなく
#      動画の実経過時間**で、「1分で入れる」と言ったものが本当に
#      何秒で終わったのかを画面が証明する（id3 で開始、id12 で停止）
#   3. 1カット1情報 … 1行1手順。すべて docs/yomogi で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ src / startFrom にし、
#      「まずどこ行く？」で冒頭に戻す。id1 と最終行はどちらも inside なので
#      トーンの継ぎ目も割れない
#   5. コメント誘発 … 「入ったら、まずどこ行く？」
#   6. 余白ゼロ … 最終行の pauseAfter は 0
#
# ■ 宣伝としてなぜ正しいか
#   未参加層の最大の障壁は「面白そうだけど、入り方が面倒くさそう」。
#   そこに正面から答える。手順を最後まで見せること自体が
#   「本当に誰でも入れる」の証明になるので、宣伝の信憑性が上がる。
#   後半の機能紹介も「入ったあと何をすればいいか」という実用情報の形で出るので
#   押し売りにならない。
#
# ■ 構造上のルール
#   - サーバー名は1秒も伏せない（id1 のテロップで名乗る）
#   - 前半（setup）は映像をぼかして沈める＝マイクラのメニュー背景に見える。
#     id12 で inside に反転してピントが合う。**転換を文字で予告しない**
#   - マイクラUIパネルは joinScreen を書いた行から後ろに引き継がれる。
#     inside に入った時点で捨てられる（実映像の上にパネルを残さない）
#   - フォームの入力値（joinName / joinAddress / joinPort）も引き継がれる
#   - 参加完了スラム（id12）と参加費0円スラム（id26）は pauseAfter を正の値にして
#     スラムが着地するまで一拍おく
#   - Switch/PS系は docs に「特殊な操作が必要・自己責任」とあるので手順本編では
#     扱わず、フレンド追加（ymg24mc）という docs 記載の代替だけ id27 で触れる
#
# ■ 情報ソース: docs/yomogi 配下（手順・機能はすべてここで裏取り）
#   参加方法（living/how-to-join/join-with-address.md）
#     - サーバーアドレス「ymg24.org」／ポート「19132」
#     - 統合版を起動 → プレイ → サーバー → サーバーを追加 → 追加してプレイ
#   フレンド追加（living/how-to-join/join-with-friend.md）
#     - 「ymg24mc」をフレンド追加すると生活鯖と人狼の両方に参加できる。
#       Switchでも本体設定を変えずに参加できる
#   はじめに（intro.md）… 統合版・参加費無料・24時間・ボランティア運営
#   役職制度（living/commands/role.md）… /roleで何度でも無料変更。
#     初期役職「鯖民」のままだと、どのブロックを掘っても報酬が得られない。
#     採掘者はダイヤ鉱石20YG など
#   土地保護（living/commands/land-protection.md）… 有料で土地を購入。
#     資源ワールド（人工資源・天然資源）では土地を買えない＝掘る場所
#   チェストショップ（living/commands/chest-shop.md）… 無人販売所
#   会社（living/commands/company.md）… 無料設立（審査あり）。社員数に制限なし
#   近距離VC（living/commands/limited-vc.md）… 近くの人と話せる。距離で音量が変わる
#
# 素材: public/content/生活サーバー 配下
# 効果音: 効果音ラボ（商用可・クレジット不要）


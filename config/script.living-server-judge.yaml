# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 裁定クイズ・セーフ？アウト？型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「裁定クイズ・セーフ？アウト？型（JUDGE）」よもぎ生活鯖 裁定クイズ
#   既存のクイズ型6つ（画面当て／ミリオネア／認定試験／相場／ウソ発見器／ぜんぶ選べ）は
#   どれも「サーバーに**何があるか**（機能・値段・事実）」を当てさせる型だった。
#   この型は「サーバーが**どう運営されているか**（制度・裁定）」を当てさせる。
#   実際に起きそうなケースを出して、視聴者を運営にして
#   「セーフ／アウト／きまってない」の3択でジャッジさせる。
#
# ■ この型の芯
#   **「あなたを守るルールが、先に決まってる」**。
#   3つ目のボタン「きまってない」は最後まで一度も正解にならない。
#   「そんなことまでルールにないでしょ」と思ったケースほど、条文つきで
#   決まっている——その驚きがそのまま「ここなら安心して入れる」という宣伝になる。
#   ぼったくり・返品・代行・くじ・面接、どれも**新規がいちばん守られる側**の
#   ルールなので、未参加者への宣伝と噛み合う。
#
# ■ 8ケースの構成（すべて docs/yomogi の条文で裏が取れる）
#   1 ぼったくり（アウト）… 最低価格2300YGの1.3倍=2990YGまで
#   2 翌日の返品（セーフ）… 新規は24時間、理由を問わず返品できる
#   3 期待値以下のくじ（アウト）… 300×0.3+2300×0.1=320YGが下限
#   4 2300YGちょうど売り（セーフ）… 手数料7%は売る側負担。手取り2139YGでも違反ではない
#   5 代行1000YG（アウト）… かんたんな操作の代行は1分200YGまで
#   6 「14歳以上？」（セーフ）… 個人情報の開示要求は原則禁止。これだけが例外
#   7 運営単独の永久Ban（アウト）… 仮処分→理由の掲載→運営投票。補償の検討まである
#   8 参加費の請求（アウト）… 0円。ボランティア運営で請求は来ない
#   判定は ア・セ・ア・セ・ア・セ・ア・ア と交互に散らしてある。
#   ケース1〜4は「高すぎアウト→安すぎアウト→ちょうどセーフ」の学習カーブ、
#   ケース7で「運営まで縛られてる」に到達してから、最終ケースで0円に着地する。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「マイクラの面接で、タメぐちは、違反なのだ」
#   2. 常設の"あと何"メーター … 判例 0 → 8
#   3. 1カット1情報 … 1ケース＝1条文
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … 裁定番組のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#
# ■ 構造上のルール
#   - 事件ファイル（jdgCase）は改行 \n 込みで2行まで（1行17文字目安）
#   - 出題行と解答行の両方に jdgCase / jdgCaseLabel / jdgAnswer を書く
#   - **判定を誤ると誤情報がそのまま画面に残る型**。条文を原文で確認してから書く
#   - 出題行のセリフは長めに書く（＝シンキングタイム）
#   - 判例集の行（jdgRowCase）は12文字以内、判定（jdgRowVerdict）は セーフ/アウト のみ
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   問番号は「第2問」〜「第6問」「第8問」を**カタカナ**（ダイニモン〜ダイハチモン）、
#   「第1問」「第7問」を**ひらがな**（だいいちもん / だいななもん）。
#   「ため口」は タメ'コオ と誤読されるので**タメぐち**。
#   「1分」は**半角数字**（イッ'プン）。「24時間」はセリフで読ませず画面にだけ出す。
#   金額は 半角数字＋ワイジイ（5000ワイジイ など）。
#   「Ban」などアルファベットは読み飛ばされるのでセリフに入れない。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   優良企業ガイドライン（tos/good-standing-company-guideline）
#     6.1 ため口面接の禁止 / 6.2.1 「14歳以上か否か」だけは聞ける /
#     10.1〜10.2 特殊技能不要の代行は1分200YGまで・事前に伝える義務 /
#     10.3 新規との取引は24時間、理由を問わず返品に応じる義務 /
#     10.4 最低販売価格の1.3倍を超える販売の禁止
#   最低販売価格（living/supplement/minimum-price）
#     ダイヤ2300YG / ギャンブルは期待値以上で販売（鉄30%+ダイヤ10%のくじ=320YG以上）
#   チェストショップの補足（living/supplement/chest-shop）
#     手数料7%は販売者負担。2300YGちょうどで売って手取り2139YGでも違反ではない
#   運営ポリシー（tos/policy）
#     処分は仮処分→運営カテゴリへの掲載（義務）→運営間の投票。
#     反対多数なら再検討され、仮処分期間中の補償（サーバー内マネーなど）が検討される。
#     投票期間は24時間または過半数到達の早い方 / 5. 無料で遊べます（ボランティア運営）


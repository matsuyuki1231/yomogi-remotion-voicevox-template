# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / ウソ発見器・ウソ当て型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「ウソ発見器・ウソ当て型（LIE）」よもぎ生活鯖 ウソ発見器
#   既存のクイズ型4つ（画面当てクイズ型 / クイズ$ミリオネア型 / 認定試験型 /
#   相場クイズ型）に共通していたのは **1問＝1事実** という構造で、
#   選択肢のうち正解以外の2つは捨て札（ありえない数字・ありえない機能）だった。
#   3枚出しているのに紹介できるのは1件だけ、という取りこぼしが常にあった。
#
#   この型はそこを反転させる。**3枚のうち1枚だけがウソで、残り2枚は本当**。
#   捨て札が消えるので **1問で2件** 紹介でき、さらに解説パネルでウソを
#   否定するときに3件目の事実が出る。全8問で **本当のことが24件** 乗る。
#   紹介できる密度は既存27型で最大。
#
# ■ この型の芯
#   **「ウソくさいほうが、本当だった」**。
#   ウソ札は「8マスまで」「審査がいる」「非公開」のような *いかにもありそうな制限* で、
#   逆に「上下50m動ける」「運営が月3万YGくれる」のような *ありえない話* が本当。
#   数問で「ありえないほうを信じればいい」と学習させ、その学習そのものを
#   「この鯖、そこまでやってるのか」という宣伝に変える。
#
#   最終問題（参加費・スマホ・24時間）だけはルールを裏切って **ウソが1枚もない**。
#   ウソを混ぜてきた側が最後だけ混ぜなかった、という形で宣伝そのものを保証する。
#   残るウソが id20 で 0 になった直後に第8問が来るのが、この型いちばんの仕掛け。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「マイクラで、上下50メートル飛べる」。
#      2行目でめたんが「ウソでしょ」と否定し、3行目で「本当なのだ」と返す。
#      この3行だけでゲームのルールを説明ゼロで飲み込ませる
#   2. 常設の"あと何"メーター … 残るウソ 7→0。0になった瞬間が仕掛けの入口
#   3. 1カット1情報 … 1問3枚。すべて docs/yomogi で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … ウソ発見器のパロディUIなので、残件数も事実リストも
#      画面が明示するのが本体（ドラマ型とは逆）
#   6. ティッカーなし … 2026年8月5日の方針変更で、流れる要約帯は作らない
#
# ■ 構造上のルール
#   - 供述カード（lieCards）は**15文字以内**（1行に収める）
#   - テーマプレート（lieTheme）は短く。ラベルは4文字前後
#   - 出題行と解答行の両方に lieTheme / lieCards / lieAnswer を書く
#   - 解答行に lieFacts を書く（＝事実リストの項目になる。11文字以内）
#   - **ウソ札は解答行で必ず明示的に否定する**。否定しないまま流すと
#     それ自体が誤情報として視聴者に残る
#   - 事実リスト（id26）でトーンが clear に変わり、供述カードが畳まれる
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   「第2問」〜「第6問」「第8問」は **カタカナ**（ダイニモン / ダイサンモン /
#   ダイヨンモン / ダイゴモン / ダイロクモン / ダイハチモン）で1句に収まる。
#   「第1問」「第7問」は**ひらがな**（だいいちもん / だいななもん）。
#   カタカナの「ダイナナモン」は ダ'イ/ナナモン' と割れる。
#   金額は「YG」がアルファベットで読み飛ばされるので **半角数字＋ワイジイ**
#   （10000ワイジイ → イチマンワイ'ジイ / 30000ワイジイ → サンマンワイ'ジイ）。
#   「18コ」「24コ」は ジュウ'/ハチ'コ と割れるので **カタカナ**（ニジュウヨンコ）。
#   「24時間」も ニ'ジュウ/ヨジ'カン と割れるので**セリフでは読ませない**
#   （画面のカードにだけ出す）。「感圧板」は カ'ン/アツ'/バ'ン と3句に割れるので
#   **ひらがな（かんあつばん）**。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   エレベーター（living/commands/elevator）… 鉄ブロック＋鉄の重量感圧版で作成、
#     ジャンプで上・スニークで下、3〜8マス。ダイヤモンドブロック製は上下各50m
#   役職制度（living/commands/role）… 石2YG／ダイヤ鉱石20YG。変更は無料・
#     クールタイムなし。木こり／採掘者／農家／エンチャンター
#   チェストショップ（living/commands/chest-shop）… 無人販売所・設置無料・手数料7%
#   有人レジ（living/commands/staffed-register）… 設置費500$・販売手数料なし
#   会社プラグイン（living/commands/company）… 設立無料（審査あり）、社長1人、
#     課長と社員は人数制限なし
#   公認企業制度（living/supplement/good-standing-company）… 月30000YGの支援金
#   処罰（living/supplement/sanction）… 点数制。5点で永久Ban、4点以下は
#     1か月ごとに1点除去。処罰は生活鯖／人狼／Discordで独立
#   土地保護（living/commands/land-protection）… 生活ワールドは100/m^2、
#     /landsell で売却可、1か月以上ログインがない土地は所有権剥奪→オークション
#   ガチャ（living/commands/gacha）… 1200YG／レッドストーンブロック3個／
#     ラピスラズリブロック1個／小麦の俵12個でチケット1枚。昼限定ガチャは11〜15時。
#     統計画面でサーバー全体と個人の排出確率を確認できる
#   参加方法（living/how-to-join、faq/device）… 統合版・参加費0円


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / ウソ発見器・ウソ当て型 第2弾）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「ウソ発見器・ウソ当て型（LIE）」よもぎ生活鯖 ウソ発見器（2本目）
#   1本目（config/script.living-server-lie.yaml / 動画ID 2bB5E4z_XYY）と
#   **同じHUD・同じフィールド・同じ構成**で、**出題を8問まるごと入れ替えた**版。
#   HUDもフィールドも一切いじっていないので、コード側の変更は不要。
#
# ■ 1本目と重複しない要素だけで8問を組んである
#   1本目で使ったのは エレベーター／役職の採掘単価／チェストショップと有人レジ／
#   会社の設立と公認企業／処罰の点数制／土地の売買／ガチャ／参加費 の8つ。
#   この2本目はそこを1つも使わず、**まだ一度も動画にしていない要素**で組んだ:
#     エフェクトのレンタル（秒課金）／最低販売価格の適用範囲／チェストショップの
#     遠隔購入と「検索機能をわざと作らなかった」設計思想／島の拡張と返金なし／
#     称号の作成制限と色分け／チェスト・ドア保護／優良企業ガイドラインの労働条件。
#   最終問題（参加費・スマホ・24時間）だけは型の締めとして1本目と共通。
#
# ■ この2本目でいちばん濃いのは第3問（チェストショップの遠隔購入）
#   「ショップの検索機能がある」がウソで、**運営がわざと作らなかった**のが正解。
#   スポーン地点に近い土地の価値が落ちるのを防ぐため、という理由まで docs に
#   書いてある。機能の有無ではなく**設計思想**が出るので、
#   「そこまで考えて作ってるのか」がいちばん伝わる。ここは尺を削らない。
#
# ■ この型の芯（1本目と同じ）
#   **「ウソくさいほうが、本当だった」**。ウソ札は「自動で止まる」「検索機能がある」
#   「返ってくる」「自由に作れる」「お金がいる」のような *いかにもありそうな親切/制限* で、
#   逆に「走るとお金がへる」「消しても返金なし」「検索はわざと無い」のような
#   *ありえない話* が本当。
#
#   残るウソが id19 で 0 になった直後に第8問が来て、そこには**ウソが1枚もない**。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「マイクラで、はやく走るとお金がへるのだ」
#   2. 常設の"あと何"メーター … 残るウソ 7→0
#   3. 1カット1情報 … 1問3枚。すべて docs/yomogi で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … ウソ発見器のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし
#
# ■ 構造上のルール（1本目と同じ）
#   - 供述カード（lieCards）は**15文字以内**、事実リスト（lieFacts）は**11文字以内**
#   - 出題行と解答行の両方に lieTheme / lieCards / lieAnswer を書く
#   - **ウソ札は解答行で必ず明示的に否定する**
#   - **出題行のセリフは長めに書く（＝シンキングタイム）**。この型はセリフが終わると
#     画面が切り替わるので、考える時間は出題行の音声の長さでしか作れない。
#     問番号＋テーマ＋ひとこと（30文字前後）にして4.5〜6秒を確保する
#   - 解説パネルの縦位置は残ったカードの枚数で変わる（2枚→1404 / 3枚→1546）。
#     3枚残る最終問題では補足を2行までに抑える
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   問番号は「第2問」〜「第6問」「第8問」を**カタカナ**（`ダイニモン`〜`ダイハチモン`）、
#   「第1問」「第7問」を**ひらがな**（`だいいちもん` / `だいななもん`）。
#   「24コ」は ジュウ'/ハチ'コ と割れるので**カタカナ**（`ニジュウヨンコ`）。
#   「24時間」は ニ'ジュウ/ヨジ'カン と割れるので**セリフでは読ませない**（カードにだけ出す）。
#   「200×200」「170%」「2300YG」「5000YG」もカードとテロップにだけ出す。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   エフェクトのレンタル（living/commands/buff）… スピード/跳躍/採掘速度は2YG/秒、
#     暗視は4YG/秒、空腹は0YG。2秒に1回2秒ぶんが自動で引かれる。複数同時は2×個数。
#     **/buff で切るかサーバーを出るまで引かれ続ける**（切り忘れ注意の記載あり）
#   最低販売価格（living/supplement/minimum-price）… 鉄300YG／ダイヤ2300YG／小麦3YG。
#     クラフト品は材料の個数×最低価格（パン9YG／鉄のツルハシ900YG／金床9300YG）。
#     **会社内の取引でも適用される**（社長が社員から買うときも2300YG以上）。
#     /checkprice で手持ちアイテムの下限を確認できる
#   チェストショップ（living/supplement/chest-shop）… 2025年5月15日から遠隔購入可、
#     遠隔時の価格は本来の170%（うち70%が手数料）。**ショップの検索機能は
#     スポーン地点に近い土地の価値低下を防ぐため意図的に設けていない**。
#     遠隔購入は毎回ショップIDの入力が必要
#   島プラグイン（living/commands/island）… 作成3,000,000YG、拡張1回目1,000,000YGで120×120、
#     5回で200×200。**削除しても作成費は戻らず復元もできない**。他プレイヤーを招待できる
#   称号プラグイン（living/commands/rank）… 作成5000YG。**太字斜体が入った称号は
#     ユーザーが作成できない**。[]の色＝白:自作／オレンジ:看板購入／水色:アスレチック報酬／
#     紫:イベント／黄緑:ミッション
#   チェスト保護（living/commands/chest-protection）… /clock、/cpasslock でパスワード付き、
#     **すべての機能が無料**。ドア保護（living/commands/door-protection）… /doorlock、無料
#   優良企業ガイドライン（living/supplement/good-standing-company）… 第6条1 面接でため口禁止、
#     第3条13 ノルマは週3時間未満、第5条8 **業務に必要な費用（ツール代など）を社員に
#     負担させてはいけない**、第7条1 事実上の時給5000YG以上に努める
#   参加方法（living/how-to-join、faq/device）… 統合版・参加費0円


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 相場クイズ・値札当て型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「相場クイズ・値札当て型（MARKET）」よもぎ生活鯖 相場クイズ
#   既存のクイズ型3つ（画面当てクイズ型 / クイズ$ミリオネア型 / 認定試験型）は
#   どれも**当てさせ方**の設計で、何を当てさせるかは毎回ばらばらだった。
#   この型は当てさせるものを**値段だけに固定する**。
#
#   よもぎ生活鯖は「生活・経済サーバー」で、いちばん作り込まれているのは
#   経済のほうなのに、既存27型のどれも価格を正面から扱っていない。
#   1問1価格に絞ると、下限価格規制・手数料・エフェクトの秒課金・
#   露天掘り代行の期待値まで、ふつうの紹介動画には絶対に入らない粒度の
#   情報が10個そのまま乗る。
#
# ■ この型の芯
#   **「見終わったとき、あなたの手元に、この鯖の価格表が1枚残る」**。
#   最後に全10件が全画面の価格表として完成する（id28・29）。
#   当たった／外れたの気持ちよさより、**その表がスクショに値すること**を優先。
#   数字は具体的であるほど「そこまで決まってるのか」に化けるので、
#   驚きと宣伝が同じ動作になる。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「マイクラの中に、値段のルールがある」。
#      id3 の「ダイヤを安く売ったら、規約違反」がいちばん強い一撃
#   2. 常設の"あと何"メーター … 相場表の記帳セグメント（0→10件）。
#      「あと何行で表が完成するのか」で最後まで引っぱる
#   3. 1カット1情報 … 1問1価格1機能。すべて docs/yomogi で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … 相場クイズのパロディUIなので、記帳件数も価格表も
#      画面が明示するのが本体（ドラマ型とは逆）
#   6. ティッカーなし … 2026年8月5日の方針変更で、流れる要約帯は作らない
#
# ■ 構造上のルール
#   - 商品プレート（mktItem）は**13文字以内**（1行に収める。2行に折ると
#     値札の吊り位置に食い込む）
#   - 値札（mktChoices）は**7文字以内**が安全（3枚横並びで1枚328px）
#   - 解説の見出しは2行まで、補足は2行まで
#   - 出題行と解答行の両方に mktItem / mktChoices を書く
#   - 解答行に mktRowLabel / mktRowValue を書く（＝価格表の1行になる）
#   - 価格表（id28）でトーンが settled に変わり、売り場が畳まれる
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   「第6問」「第8問」は ダ'イロ/ク'モン、ダ'イワ/チ'モン と割れるので
#   **カタカナで ダイロクモン / ダイハチモン と書く**。
#   ほかの問番号はひらがな（だいいちもん など）で1句に収まる。
#   金額は「YG」がアルファベットで読み飛ばされるので **半角数字＋ワイジイ**
#   （5000ワイジイ → ゴセンワイ'ジイ）。ただし 32050 は3句に割れるので
#   **サンマンニセンゴジュウワイジイ** とカタカナで書く。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   土地保護（living/commands/land-protection）… 生活ワールドは100/m^2
#   役職制度（living/commands/role）… 石2YG／鉄5YG／金5YG／ラピス7YG／
#     レッドストーン3YG／ダイヤ20YG。役職変更は無料・クールタイムなし
#   最低販売価格（living/supplement/minimum-price）… 鉄300YG／ダイヤ2300YG／
#     小麦3YG。露天掘り代行は1チャンク32050YG（＝2300×3.5＋300×80 の期待値）
#   チェストショップ（living/commands/chest-shop）… 設置無料・手数料7%・
#     2025年5月15日から遠隔購入可（遠隔時は170%）
#   エフェクトのレンタル（living/commands/buff）… スピード/跳躍/採掘速度は
#     2YG/秒、暗視は4YG/秒、空腹は0YG
#   称号プラグイン（living/commands/rank）… 自作称号は5000YG
#   ガチャ（living/commands/gacha）… 1200YG またはラピスラズリブロック1個で
#     チケット1枚。昼限定ガチャは11時〜15時
#   島プラグイン（living/commands/island）… 作成に3,000,000YG。拡張5回で200×200
#   はじめに（intro）… 統合版／参加費無料／24時間
#
# 素材: public/content/生活サーバー 配下
# 効果音: 効果音ラボ（商用可・クレジット不要）


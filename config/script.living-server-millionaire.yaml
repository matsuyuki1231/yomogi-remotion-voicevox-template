# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / クイズ$ミリオネア型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「クイズ$ミリオネア型（MILLIONAIRE）」
#   これまでのクイズ型3つ（3択＋カウントダウンリング / ○× / 画面当て）は、
#   どれも**1問ごとに完結していて、賭かっているものが無かった**。当たっても外れても
#   次の問題が来るだけ。この型はそこを壊す。**賞金ラダーを1段ずつ上っていく**構造にして、
#   「いま何段目にいるのか」「あと何段で頂上か」を右端の縦一列で常設で見せる。
#   さらに**ライフラインという第2のリソース**（50:50 / オーディエンス / テレホン）を
#   持たせる。使えば減って二度と戻らない。既存22フォーマットに一度も無かった装置。
#
# ■ 縦画面との相性
#   賞金ラダーは本家では画面右の縦一列。9:16はそれをそのまま置ける唯一の比率で、
#   6段が常に見えている＝"あと何"メーターとして最も強く働く。
#   巻き戻し型のレールが「上から下へ降りる」のに対し、こちらは「下から上へ登る」。
#
# ■ この型の芯（賞金が架空じゃない）
#   最終問題の正解「0円」で最高額 300万YG を獲得する。だが賞金は出ない。
#   そのかわり **300万YG はこの鯖で実際に稼げる額**（島の作成費がちょうど 3,000,000YG）。
#   つまり「茶番の賞金が、実在の通貨だった」に着地する。経済鯖の宣伝と
#   クイズ番組の茶番が、最後の数行で同じものになる。
#   宣伝が押し売りにならないのは、めたんが自分から「それ本当にもらえるの？」と
#   聞くのに答える形になっているから。
#
# ■ この型の芯・その2（毎回「え、そこまで具体的なの」で驚かせる）
#   画面当てクイズ型の芯は「いちばんありえない選択肢が正解」だったが、こちらは
#   **全部が具体的な数字**（275種類／20YG／300万YG／制限なし／時給5,000YG／0円）。
#   最大値が正解とは限らない（Q2 のダイヤは 100YG ではなく 20YG）ので当てずっぽうが
#   効かず、そのぶん「そこまで細かく決まってるのか」という驚きが宣伝になる。
#   出典を milFact に必ず書く（2026年に強い「意外な事実型」は出典明記で信憑性を担保する）。
#
# ■ この型は「説明してよい」型
#   最初からクイズ番組のパロディUIだと分かる茶番なので、常設メーター（賞金ラダーと
#   ライフライン）で残りを明示してよい。賞金額と投票率は演出なので注記で明示する。
#
# ■ 視聴維持の装置
#   1. 賞金ラダー（milStep / milWon）… **この型の"あと何"メーター**。下から上へ登る
#   2. ライフライン3つ（milLifeline）… 使うと×が打たれて減る。第2のリソース
#   3. 挑戦者プレート「挑戦者 あなた」… 視聴者が当事者だと常設で言い続ける
#   4. 制限時間バー（milTimer）… 出題行の尺いっぱいで縮む＝答える強制力
#   5. 4択（A/B/C/D）… 本家と同じ2×2。オーディエンスの棒がボタンの中を満たす
#   6. ファイナルアンサー？帯（milFinal）… 最終問題だけ
#
# ■ 構造上のルール
#   - 1問＝出題行＋解答行の2行。ライフラインを使う問題だけ3行になる
#   - 出題行: milStep / milQ / milChoices / milAnswer / milTimer: true
#   - 解答行: 同じ milChoices / milAnswer に milShowAnswer: true と milWon: true を足し、
#     milVerdict（中央スタンプ）と milFact（根拠＝出典）を書く
#   - **milChoices は出題行・解答行・ライフライン行すべてに同じ内容を書く**
#   - **milAnswer は 0 始まり**。正解の位置は毎回散らす（2 → 1 → 3 → 0 → 3 → 2）
#   - ライフラインの行にも milChoices を書く（50:50 なら milKeep、
#     オーディエンスなら milAudience を足す）
#   - サーバー名は伏せない。id1 で「ここは、よもぎサーバーの生活鯖なのだ」と名乗る
#   - milHook / milQ / milChoices / milLifeline / milVerdict / milRetort / milFlash /
#     milWin / milReveal / milResult がある行はテロップが字幕を兼ねるので字幕を出さない。
#     字幕は検索CTA（id25）の行だけ
#   - BGMの切替（fromLineId）は最終問題の正解＝トーンが win になる行（id19）に合わせる
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 出題は全部 docs/yomogi で裏が取れる数字にする（賞金額と投票率だけが演出）
#   釣り275種類（docs/yomogi/intro.md）
#   採掘者はダイヤモンド鉱石1つで20YG（living/commands/role.md）
#   島の作成は3,000,000YG（living/commands/island.md）
#   会社は社長1人・課長と社員の人数に制限なし（living/commands/company.md）
#   優良企業ガイドライン7.1 事実上の時給5,000YG以上（living/supplement/good-standing-company.md）
#   参加費無料・統合版・24時間（docs/yomogi/intro.md）
#   土地を購入して家や店を建てられる（living/commands/land-protection.md）
#   近距離VCで近くの人としゃべれる（living/commands/limited-vc.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: spotlight / don-1 / question1 / correct1 / item-get1 / shock1 / drum-roll1 /
#         jajean1 / people-performance-cheer1 / sceneswitch1 / 決定ボタンを押す2 /
#         決定ボタンを押す4 はいずれも効果音ラボ（商用可・クレジット不要）


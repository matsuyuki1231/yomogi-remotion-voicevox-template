# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 同時中継・マルチ画面型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「同時中継・マルチ画面型（MULTI）」よもぎ生活鯖 24時間同時中継
#   既存33型はすべて「次のカットが来ると前の情報が消える」構造だった。
#   報道も裁判も通販もクイズもドラマも、無限ズーム型ですら画面は置き換わっていた
#   （ズーム型は前の層が奥へ消えていく）。カードパック開封型のコレクション一覧や
#   ウソ発見器型の事実リストのように「あとでまとめて出す」型はあったが、
#   **出したものが消えずに動き続ける**型はひとつもなかった。
#
#   この型はそこを壊す。**一度出した中継は、最後まで1つも消えない**。
#   新しい中継が入るたび、いままでのメインモニターは縮んで下の壁へ移り、
#   そこで動き続ける。画面はどんどん賑やかになっていく。
#
# ■ この型の芯
#   **「1個ずつじゃない。ぜんぶ、同時」**。紹介し終えた機能が画面に残るので、
#   終盤には12個の暮らしが同時に動いている壁ができる。これは
#   「24時間あそべる生活・経済サーバー」という事実そのものの画になる。
#   めたんが id5「さっきの画面、まだ動いてるわよ」で構造に気づき、
#   ずんだの id6「消えないのだ」がこの型の宣言になる。
#
# ■ 画面は 1 → 多 → 1 と動く
#   1画面（街）→ メイン＋壁（中継が12個に増える）→ **12分割の全画面**
#   （クライマックス。スクショ対象）→ 合流して1画面（＝ぜんぶ同じ街）。
#
# ■ 12中継の構成（すべて docs/yomogi で裏が取れる）
#   CH.01 生活ワールド     … 24時間あそべる生活・経済サーバー（intro）
#   CH.02 自分の土地       … 生活ワールドは 100$/m^2（land-protection）
#   CH.03 家を建てる       … 買った土地は本人と共有者だけが編集できる（land-protection）
#   CH.04 チェスト保護     … 自分だけが開ける・すべて無料（chest-protection）
#   CH.05 無人のお店       … 設置は無料・収益の7%が手数料（chest-shop）
#   CH.06 会社をさがす     … 無料で設立（審査あり）・社員の人数に制限なし（company）
#   CH.07 会社の帳簿       … 優良企業は事実上の時給5000YG以上（good-standing-company 7.1）
#   CH.08 資源ワールドで採掘 … 採掘者はダイヤモンド鉱石1個で20YG（role）
#   CH.09 畑で農業         … 農家はスイカとかぼちゃで3YG（role）
#   CH.10 釣り             … 釣れる魚は275種類（intro）
#   CH.11 車で移動         … 生活ワールドを駆け回れる（intro）
#   CH.12 ガチャ           … チケット1枚 1,200YG。小麦の俵12個でも交換（gacha）
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 「ぜんぶ、同時」＝1個ずつ見せる普通の紹介動画への宣戦布告
#   2. 常設の"あと何"メーター … 同時中継 01 → 12。**空きスロットが最初から
#      12枠ぶん見えている**（NO SIGNAL）ので、埋まっていく画そのものがメーター
#   3. 1カット1情報 … 1中継＝1機能。ただし**前の中継は消えない**
#   4. ループ … 合流した1画面の街で締める
#   5. 説明してよい型 … 同時中継のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#   7. コメント誘発 … 「どの中継から始める？」
#
# ■ 構造上のルール
#   - mulSrc を書いた行が新しい中継の入口（メインモニターに乗る）
#   - **12中継はすべて同時に画面にいる**ので、素材は12本とも別のファイルにする
#   - 中継は最後まで消えないので、素材が尽きたら頭から繰り返す。
#     **使える区間が狭い素材は mulSpan でその区間だけをループさせる**
#     （夜で暗い区間・GUIが閉じている区間を踏まないため）
#   - mulTone: wall の行で12分割の全画面に組み変わり、merge の行で1画面に合流する
#   - **合流の行で宣言した mulSrc は13本目ではない**（カウンターに入らない）
#   - mulSpec は画面に出る文字なので **YG / % はそのまま書く**
#     （`ワイジイ` などのTTS用カタカナを書かないこと。セリフ側だけカタカナ）
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   「12こ」は ジュウ'/ニ'コ に割れるので**カタカナ `ジュウニコ`**。
#   「275種類」も割れるので**カタカナ `ニヒャクナナジュウゴシュルイ`**。
#   金額は**セリフでは**半角数字＋ワイジイ。0円は「ゼロエン」。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   はじめに（intro）… 統合版 / 参加費無料 / 24時間 / 釣り275種類 / 車 / ガチャ
#   土地保護（living/commands/land-protection）… 生活ワールドは100$/m^2。
#     購入した土地は購入者と土地共有者だけが編集できる
#   チェスト保護（living/commands/chest-protection）… 自分だけが開ける。すべて無料
#   チェストショップ（living/commands/chest-shop）… 無人販売所。無料設置・収益の7%が手数料
#   会社プラグイン（living/commands/company）… 無料で設立（審査あり）。
#     社長は1人、課長・社員の人数に制限なし
#   公認企業制度（living/supplement/good-standing-company 7.1）…
#     企業は社員の事実上の時給が5000YG以上になるように努めなければならない
#   役職制度（living/commands/role）… 採掘者はダイヤモンド鉱石で20YG、
#     農家はスイカとかぼちゃで3YG
#   ガチャ（living/commands/gacha）… チケット1枚は1200YG、または小麦の俵12個など


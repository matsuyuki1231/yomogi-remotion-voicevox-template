# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / カードパック開封型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「カードパック開封型（PACK）」よもぎ生活鯖パック 開封の儀
#   既存30型が一度も使っていない「開封」の快感を骨格にする。
#   カードパックを1つずつ開封し、中から出た暮らしのカード
#   （枠の中で実映像が動く）をコレクションに収めていく（0→8枚）。
#   クイズではない全編宣伝で、当てさせる動作の代わりに
#   **開ける動作**が3秒ごとの新情報を供給する。
#
# ■ この型の芯
#   **「SSRの暮らしが、封入率100%」**。どのカードにも「封入率 100%」の
#   赤い判が押されており、めたんが中盤で「ぜんぶに100%って書いてあるわよ」と
#   気づく。ガチャ・パック開封の文法でレア感を演出しながら、
#   最後に「レアに見えて、参加すれば全員もらえる」へ着地する——
#   レアリティのインフレ（R→SR→SSR→UR）と、排出が確定していることの
#   矛盾そのものが宣伝になる。最後の1枚は「参加費0円」（レアリティFREE）。
#
# ■ 画面の構造（既存の「上=映像/下=カード」を捨てて、カードを画面の主役にする）
#   中央に巨大なトレカが立ち、**カードのイラスト窓の中で実映像が動く**
#   （SceneVisuals の pack モード）。開封行では、卓上のパックが揺れて
#   裂け、白フラッシュとともにカードが現れる。レアリティ演出
#   （R=青 / SR=紫 / SSR=金+集中線 / UR=虹 / FREE=緑）で驚きを段階づける。
#
# ■ 8枚の構成（すべて docs/yomogi で裏が取れる）
#   1 R    自分の土地      … 1マス100YG / 買った土地は荒らされない（land-protection）
#   2 SR   無人のお店      … 寝てても売れる / 手数料7%（chest-shop）
#   3 SR   魚275種類       … バニラにない魚（intro）
#   4 SSR  会社の社長      … 設立無料・審査あり / 社員の人数制限なし（company）
#   5 SSR  近距離VC        … 距離で聞こえる / 離れると小さくなる（limited-vc）
#   6 SSR  車              … 生活ワールドを駆け回れる（intro）
#   7 UR   自分だけの島    … 300万YG / 最大200×200（island）
#   8 FREE 参加費0円       … 統合版ならそのまま / 24時間（intro / how-to-join）
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「SSRしか出ないパックが、あるのだ」
#   2. 常設の"あと何"メーター … コレクション 0 → 8
#   3. 1カット1情報 … 1パック＝1カード＝1機能
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … パック開封のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#   7. コメント誘発 … 「あなたなら、どれから引く？」
#
# ■ 構造上のルール
#   - packCard を書いた行が開封行（パックが裂けてカードが出る）。
#     packFlash / packHook を書いた行ではカードを出さない（映像が全画面に開く）
#   - ツッコミだけの行では直前のカードを持ち越す（held。演出は焼き直さない）
#   - packSpecs は2行まで・1行15文字以内。packRowName は12文字以内、
#     packRowNote は11文字以内
#   - レアリティは演出なので、CTAの注記で明示する
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   「SSR」「UR」はアルファベットが読み飛ばされるので
#   **エスエスアール / ユーアール** とカタカナで書く。
#   枚数は**漢字の「1枚目」〜「8枚目」**（イチマイ'メ と1句にまとまる。
#   ひらがな・カタカナだと ヨ'/ンマ'イ/メ' などに割れる）。金額は 半角数字＋ワイジイ
#   （300万ワイジイ → サンビャクマンワイ'ジイ）。0円は「ゼロエン」。
#   「入れば」は イレバ と誤読されうるので「参加すれば」と言い換える。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   土地保護（living/commands/land-protection）… 生活ワールドは100$/m^2。
#     購入した土地は購入者と共有者だけが編集できる
#   チェストショップ（living/commands/chest-shop）… 無人販売所。無料設置・
#     収益の7%が手数料。看板タップで購入
#   釣り（intro）… 釣れる魚は275種類。バニラにない魚
#   会社（living/commands/company)… 誰でも無料で設立（審査あり）。
#     社長は1人、課長・社員の人数に制限なし
#   近距離VC（living/commands/limited-vc）… 近くにいる人としゃべれる。
#     距離を変化させると音量も自動で変化
#   車（intro）… 車に乗って生活ワールドを駆け回れる
#   島（living/commands/island）… 作成3,000,000YG。拡張5段階で最大200×200
#   参加（intro / living/how-to-join）… 統合版・参加費無料・24時間


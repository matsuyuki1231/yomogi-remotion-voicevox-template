# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 複数選択クイズ・ぜんぶ選べ型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「複数選択クイズ・ぜんぶ選べ型（PICK）」よもぎ生活鯖 ぜんぶ選べクイズ
#   既存のクイズ型5つ（画面当て／ミリオネア／認定試験／相場／ウソ発見器）は
#   どれも **正解が毎回1枚** で、「どれか1つ選べばいい」という構えで見られた。
#   この型は **あてはまるものを"ぜんぶ"選ばせる**。1問4枚のうち何枚が正解かは
#   毎回変わる（2枚のことも4枚のこともある）。
#
# ■ 捨て札ゼロの作り方
#   正解の札 = 実在する機能（24枚）／ハズレの札 = **よくある誤解**（8枚）。
#   ハズレは解答行で必ず明示的に否定するので、否定すること自体が情報になる。
#   だから32枚すべてが宣伝として働く。既存27型で最大の情報密度。
#
# ■ この型の芯
#   **「選ばなかったぶんが、まだできる」**。数問で視聴者は「迷ったら全部選べ」と
#   学習する。その学習を id20 でめたんに言わせて（＝「もう、ぜんぶ選んだほうが早いわ」）、
#   直後の最終問題で **4枚ぜんぶが正解** になる。混ぜてきた側が最後だけ
#   混ぜなかった、という形で宣伝そのものを保証する。
#
# ■ 8問で紹介するもの（すべて docs/yomogi で裏が取れる）
#   土地／商売（チェストショップ・有人レジ）／会社／かせぎ方（役職）／
#   あそび（釣り・車・ガチャ）／声（近距離VC）／ルール（処罰の点数制）／参加
#
# ■ ハズレ札（＝否定する誤解）8枚
#   「空いている土地は早い者勝ち」「一度買ったら永久に自分のもの」
#   「店を出すには運営の許可がいる」「会社の設立にはお金がかかる」
#   「最初の役職のままでもお金が入る」「車は他の人に売れる」
#   「マイクラのアプリだけで話せる」「1回の違反でいきなり永久Ban」
#   どれも**新規が実際に誤解しやすいもの**にしてあるので、否定が実用情報になる。
#
# ■ いちばん濃いのは第4問（かせぎ方）
#   初期役職の「鯖民」のままだと何を掘っても報酬が0という、**知らないと損をする**情報。
#   入った人がまず得をする話なので、この問だけセリフを削らない。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで「マイクラの中で、社員をやとえるのだ」
#   2. 常設の"あと何"メーター … できること 0 → 24
#   3. 1カット1情報 … 1問4枚
#   4. ループ … 最終行の映像を id1 と同じ位置に戻して冒頭へ返す
#   5. 説明してよい型 … チェックリストのパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#
# ■ 構造上のルール
#   - チェックリスト（pickCards）は**15文字以内**、事実リスト（pickFacts）は**11文字以内**
#   - 出題行と解答行の両方に pickTheme / pickCards / pickAnswers を書く
#   - **ハズレ札は解答行で必ず明示的に否定する**
#   - **出題行のセリフは長めに書く（＝シンキングタイム）**。4枚読ませるので
#     ウソ発見器型（3枚）より長め、30〜35文字を目安にする
#   - 解説パネルの位置は固定（カードは4枚のまま落とさない）。補足は2行まで
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   問番号は「第2問」〜「第6問」「第8問」を**カタカナ**（ダイニモン〜ダイハチモン）、
#   「第1問」「第7問」を**ひらがな**（だいいちもん / だいななもん）。
#   「24こ」は ジュウ'/ヨン'コ と割れるので**カタカナ**（ニジュウヨンコ）。
#   数字・記号・URLはセリフで読ませず、カードとテロップにだけ出す。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   土地保護（living/commands/land-protection）… 有料で購入、生活ワールドは100YG/m²。
#     /landsell で売却、/landgive で譲渡。所有者と共有者が全員1か月以上
#     ログインしないと所有権が自動で剥奪される
#   チェストショップ（living/commands/chest-shop）… 無人販売所、収益の7%が手数料。
#     有人レジ（living/commands/staffed-register）… 設置費500$、販売手数料なし。
#     どちらも自分の土地（または共有された土地）なら申請なしで作れる
#   会社プラグイン（living/commands/company）… すべての機能が無料。設立には審査あり。
#     社長は1人、課長と社員の人数に制限なし。/company journal で帳簿を閲覧
#   役職制度（living/commands/role）… 採掘者は石2YG・ダイヤ鉱石20YG、木こりは原木5YG、
#     農家はスイカとかぼちゃ3YG。/role で何度でも無料変更、クールタイムなし。
#     **初期役職の「鯖民」は特に効果がなく、何を掘っても報酬が得られない**
#   釣り275種類・車・ガチャ（intro / living/commands/gacha）… 昼限定ガチャは11時〜15時。
#     **車などの水平移動可能なエンティティの転売・譲渡は禁止**
#     （tos/minecraft-terms-and-conditions 2.2(5)）
#   近距離VC（living/commands/limited-vc）… vc.ymg24.org にDiscordでログインして参加。
#     Minecraft-Discord連携が必要。鯖内の距離で音量が変わる
#   処罰（living/supplement/sanction）… 点数制。1点=処罰なし／2点=警告マーク／
#     3点=設置破壊とチャット禁止／4点=期限付きBan／5点=永久Ban。
#     4点以下は1か月ごとに1点消える。生活鯖・人狼・Discordで処罰は独立。
#     /sanctionhistory で自分の点数と履歴が見られる
#   参加方法（living/how-to-join、faq/device）… 統合版・参加費0円・24時間


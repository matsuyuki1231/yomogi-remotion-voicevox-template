# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 正直CM・王道PR型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「正直CM・王道PR型（PROMO）」これは宣伝です
#   既存24型はすべて「何かのフリ」だった。報道のフリ、裁判のフリ、通販のフリ、
#   クイズ番組のフリ、求人サイトのフリ、ドラマのフリ——正体やサーバー名を隠して
#   好奇心ギャップで引っぱるのが共通の骨格だった。
#   この型は**フリそのものをやめる**。1行目で「これは、宣伝なのだ！」と宣言し、
#   最後の1秒まで一切ひねらずに宣伝だけをする。広告は普通、広告であることを
#   隠したがる。それを堂々と名乗ること自体が、この型の唯一の「転」。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 「これは、宣伝です」のスラム。CMの逆張り宣言が一撃目
#   2. 常設の"あと何"メーター … 「できること n / 15」カウンター。
#      カタログの目次そのものがメーターになる（この型は最初から宣伝なので
#      パロディUIですらなく、明示してよいどころか明示が本体）
#   3. 1カット1情報 … 1行1機能で15連発。すべて docs/yomogi で裏が取れる実在機能
#   4. ループ … 最終行の映像を id1 と同じ src / startFrom にし、
#      「どれから始める？」で冒頭の宣言に戻す
#   5. コメント誘発 … 「どれから始めるか、コメントで」
#   6. 余白ゼロ … 最終行の pauseAfter は 0
#
# ■ 宣伝としてなぜ正しいか
#   ひねった型は「宣伝だと気づかせない」ことに構造コストを払っている。
#   この型はそのコストをゼロにして、浮いたぶんを情報密度に全振りする。
#   「宣伝です」と最初に言い切ってしまえば、以降のどの機能紹介も
#   押し売りに見えない（見ている側は宣伝だと承知の上で見ているから）。
#
# ■ 視聴維持の装置
#   1. できることカウンター（pvNo）… 1 → 15。「全部でいくつあるのか」で引っぱる
#   2. 機能カード（pvCard）… 1カット1機能。番号バッジつきで下から滑り込む
#   3. ヘッダの「宣伝」バッジ … 常時明滅。正直さを画面の隅で言い続ける
#   4. 参加費0円スラム（pvPrice）… 15個目だけ全画面。カタログの最後の1行が
#      値段なのは通販型と同じだが、この型は最初から宣伝なので落差ではなく着地
#
# ■ 構造上のルール
#   - サーバー名は1秒も伏せない（id1 で宣言、id3 で名乗る）
#   - 機能は15個。すべて docs/yomogi で裏が取れるものだけ
#     （土地・家・無人店・チェスト保護・会社・釣り275種・農業・資源ワールド・
#      バフ・車・ガチャ・称号・島・近距離VC・参加費0円）
#   - 3〜4機能ごとにめたんのツッコミを挟んでリズムを作る
#   - pvHook / pvCard / pvRetort / pvFlash / pvPrice / pvReveal / pvResult がある行は
#     テロップが字幕を兼ねるので字幕を出さない。字幕は検索CTA（id24）の行だけ
#   - 参加費0円の行（id22）だけ pauseAfter を正の値にしてスラムを見せる
#   - Switch/PS系は「特殊な操作が必要・自己責任」と docs に書いてあるので
#     謳わない。デバイスの話は「スマホでも遊べる」だけに留める（faq/device.md）
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 情報ソース: docs/yomogi 配下（機能はすべてここで裏取り）
#   はじめに（docs/yomogi/intro.md）
#     - 統合版・参加費無料・24時間・運営形態はボランティア
#     - 共通の生活ワールドに土地を購入して自分だけの家や店を建築できる
#     - 採掘や農業、木こり、釣りなどもでき、作業勢にもおすすめ
#     - 会社制度／近距離VC／チェストショップ／釣り275種／ガチャ／島／車
#   土地保護（living/commands/land-protection.md）… 有料で土地を購入。
#     人工資源・天然資源などの資源ワールドがあることもここに記載
#   チェストショップ（living/commands/chest-shop.md）… 無人販売所
#   チェスト保護（living/commands/chest-protection.md）… 無料。自分だけが開けられる
#   会社（living/commands/company.md）… 無料で設立（審査あり）。社員の人数に制限なし
#   バフ（living/commands/buff.md）… 採掘速度上昇・暗視などを有料レンタル
#   ガチャ（living/commands/gacha.md）… チケットでガチャを引ける
#   称号（living/commands/rank.md）… 自作称号を作れる
#   島（living/commands/island.md）… 自分だけのワールドを作成できる
#   近距離VC（living/commands/limited-vc.md）… 近くの人と話せる。距離で音量が変わる
#   デバイス（living/faq/device.md）… スマホから参加できる
#
# 素材: public/content/生活サーバー 配下。機能名と同じ内容の素材を1対1で当てる
# 効果音: don-1 / question1 / sceneswitch1 / shock1 / correct1 / jajean1 /
#         決定ボタンを押す1〜5系 はいずれも効果音ラボ（商用可・クレジット不要）


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 路線図・車内アナウンス型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「路線図・車内アナウンス型（RAIL）」よもぎ生活線
#   既存27型はすべて「1枚の画面に、カード／プレート／チップ／メーターが
#   出入りする」構造だった。報道も裁判も通販もクイズも求人票もドラマも、
#   視聴者はずっと同じ場所に座って、目の前を情報が通り過ぎるのを見ていた。
#   この型は**視聴者を乗り物に乗せて移動させる**。
#
#   画面の上半分は電車の車内案内表示器（LED）。路線名・「次は○○」・
#   横向きの路線図・運賃が常設で出る。中央には駅名標が右から流れてきて
#   減速停止する（＝電車が駅に着く動き）。走行中は窓の外＝実映像が
#   高速で横に流れて車体が揺れ、停車すると止まる。
#
# ■ この型の芯
#   「全部の駅で降りなくていい。1駅でいい」（id20〜22）。
#   既存の型はどれも「できることを盛る」方向だったが、盛ったうえで
#   **ひとつ選べと言う**。未参加層の「入っても何をすればいいか分からない」
#   「ついていけなさそう」に正面から答える。
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 前置きゼロで車内アナウンス
#      「次は、あなたの家。あなたの家です」から入る。持っていない人の
#      家が次の駅として announce される違和感がそのままフックになる
#   2. 常設の"あと何"メーター … 路線図（全11駅）と「終点まで あと○駅」。
#      さらに運賃が「？？？円」のまま終点まで引っぱられる
#   3. 1カット1情報 … 1駅1機能。すべて docs/yomogi で裏が取れる
#   4. ループ … **環状線という設定でループ再生を構造的に正当化する**。
#      最終行の映像・「次は」表示を id1 と同じにして冒頭へ返す
#   5. 説明してよい型 … 車内案内表示器のパロディUIなので、
#      残り駅数や運賃を画面が明示するのが本体（ドラマ型とは逆）
#
# ■ 構造上のルール
#   - サーバー名は id27 のまとめ帯まで伏せる。引っぱるのは路線図と運賃
#   - 駅に着く行にだけ railMoving: false を書く（**引き継がない**）。
#     書いていない行は走行中で、映像が流れて車体が揺れる
#   - 走行行の railNo は「これから向かう駅」の番号にする。
#     路線図の電車はその1つ手前と駅の中間に立つ
#   - 運賃0円スラム（id26）は pauseAfter を正の値にして着地を待つ
#
# ■ 情報ソース: docs/yomogi 配下（駅名だけがこちらの創作）
#   はじめに（intro.md）… 統合版・参加費無料・24時間・ボランティア運営／
#     釣りで釣れる魚は275種類／会社制度／近距離VC／チェストショップ／
#     ガチャ／島／車
#   土地保護（living/commands/land-protection.md）… 土地を購入して保護。
#     資源ワールドでは土地を買えない＝掘る場所
#   チェストショップ（living/commands/chest-shop.md）… 無人販売所
#   会社（living/commands/company.md）… 設立は無料（審査あり）。社員数に制限なし
#   近距離VC（living/commands/limited-vc.md）… 近くの人と話せる。距離で音量が変わる
#   島（living/commands/island.md）… 作成に 3,000,000YG
#   称号（living/commands/rank.md）／ガチャ（living/commands/gacha.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: 効果音ラボ（商用可・クレジット不要）


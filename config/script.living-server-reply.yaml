# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / コメント返信・反論処理型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「コメント返信・反論処理型」（前半は"マイクラ飽きた"論で釣り、後半で宣伝）
#   画面がまるごとコメント欄になる。冒頭1秒でいちばん強い煽りコメント
#   「マイクラ、もうやることなくない？」が画面を占拠し（＝クライマックスから始める）、
#   2行目で「よもぎサーバーに来る質問なのだ」と何の動画かを明示してから、
#   めたんとずんだもんが1件ずつ返信していく。常設の《未回答 6件》カウンターが
#   減っていくので「0件になったら終わるのか」で最後まで引っぱれる。
#   0円の回答で未回答0件＝回答完了スラム（白フラッシュ）を出してトーンを解除し、
#   その直後に最後の新着コメント「で、どうやって入るの？」が飛び込んで、
#   まとめ帯→検索CTAへつながる。視聴者の質問に答える形なので押し売りにならない。
#   締めは「質問、まだある？」でコメント誘発＋冒頭のコメントへループ。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 冒頭1秒は「起」ではなく「転」から始める（いきなり強いコメントを出す）
#   2. 45〜75秒の高情報密度が優遇される。3秒ごとに新情報（＝1コメント1カット）
#   3. コメントを誘発する「隙」を企画段階で設計する
#      → 質問に答える形式そのものが隙。締めで「まだある？」と明示的に開く
#   4. 期待を裏切るギャップ。未回答0件＝終わりと見せてから新着1件で引き戻す
#
# ■ 視聴維持の装置
#   1. コメント欄UI（ReplyChrome）… ヘッダの返信中ランプ、背景を流れるコメント片、
#      最下部の入力欄バーが常時動く。回答完了以降は赤「返信中」→緑「解決ずみ」
#   2. 未回答カウンター＋解決バー（replyPending）… 6→0。「あと何件」で引っぱり、
#      新着で1に戻る瞬間が最大のギャップ
#   3. 質問カード→返信カードの上下2枚組。回答行では質問カードが小さく残るので
#      文脈を見失わない（字幕の代わりに読ませる）
#   4. 好奇心ギャップ …「どのサーバーの話なのか」を最後の1件まで明かさない
#
# ■ 構造上のルール
#   - サーバー名は id2 で出す。何の動画か分からないまま進むと趣旨が伝わらないため。
#     引っぱりは名前を伏せることではなく《未回答カウンター》が担う
#   - 転換（id14）: 回答完了スラム「0円 / 未回答0件」で replyTone を calm に。
#     ここでBGMも切り替える（defaults.yaml の segments）
#   - 新着（id15）で未回答が1に戻り、id16 のまとめ帯 → id17 の検索CTA へつなぐ
#   - 結果リボン（id18, pauseAfter:0）で冒頭にループ。id1 と id18 は同じ映像・同じ startFrom
#   - 字幕は検索CTA（id17）の行だけ。ほかの行は質問カード・返信カードがテロップを兼ねる
#   - 回答行にも replyQuestion を書く（質問カードが小さく残り、何への返信か分かる）
#   - replyTicker は全行ぶんを1本に連結して常時流す（Main が集約）
#   - コメントの投稿者名は明らかに架空のハンドル。実在のコメントの引用ではない
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと。
#     開始位置＋そのセリフの尺が素材の終端を越えると、カット後半が静止・黒コマになる
#
# ■ 情報ソース: docs/yomogi 配下（回答はすべてここで裏取り）
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - Java版では参加不可。スマホ/Switch/PS4/PS5からも参加できる（how-to-join, faq/device.md）
#   - 土地を購入して自分だけの家や店を建てられる（intro.md, land-protection.md）
#   - 購入した土地は購入者と土地共有者だけが編集できる（land-protection.md）
#   - チェスト保護は無料。保護したチェストは自分だけが開けられる（chest-protection.md）
#   - 会社制度で本格的な会社経営（intro.md, company.md）
#   - チェストショップ＝無人販売所（intro.md, chest-shop.md）
#   - 近距離VCで近くの人としゃべれる（intro.md, limited-vc.md）
#   - 釣りで釣れる魚は275種類／ガチャ／車で駆け回れる（intro.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: text-impact3 / 決定ボタンを押す4 / question1 / correct1 / item-get1 /
#         people-shout-oo2 / drum-roll1 / don-1 / 決定ボタンを押す2 / jajean1
#         はいずれも効果音ラボ（商用可・クレジット不要）


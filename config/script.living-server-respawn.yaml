# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / リスポーン型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「リスポーン型」（画面まるごとマイクラのゲームUI）
#   これまでの型はすべて「テレビ番組・Webサイト・アプリのパロディUI」だった
#   （報道／裁判／通販／コメント欄／街頭インタビュー／求人サイト）。ドラマ型だけは
#   UIを捨てたが、それも画面の外側の話だった。この型は**画面をマイクラの
#   ゲームUIそのものにする**。体力ハート・空腹ゲージ・経験値バー・ホットバー・
#   進捗トースト・死亡画面——マイクラを触ったことがある人なら説明ゼロで意味が分かる。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 完了率がすべて。45〜60秒・高情報密度が優遇される（1カット1情報で28カット）
#   2. 冒頭1秒は「起」ではなく「転」。前置きゼロで「あなたのワールド、まだ残ってる」
#   3. 作り込みより「共感（relatability／authenticity）」が効く。既存フォーマットは
#      どれもギャップ・茶番・ドラマで、**見ている人自身の記憶**を軸にした型はなかった
#   4. ループ再生も再生回数に加算される → 最終行でトーンを world に戻し、
#      映像も id1 と同じ位置にしてワールド選択画面へ戻す
#   5. コメント誘発を構造に埋める → 最終行「最終ログイン、いつ？」
#
# ■ ターゲット設計（宣伝としてなぜ正しいか）
#   生活サーバーにまだ来ていない人＝「昔マイクラをやっていて、いつのまにか
#   開かなくなった人」。この層に刺さる言葉は「新しいサーバーがあります」ではなく
#   「飽きたんじゃない、やることが無くなっただけ」。id18 がこの動画の芯で、
#   そこまでの記憶パートは全部この一行を刺すための助走になっている。
#   宣伝は「復帰の受け皿」として出るので押し売りにならない。
#
# ■ 視聴維持の装置
#   1. 体力ハート10個（respHp）… **この型の"あと何"メーター**。あるあるが刺さるたび
#      1個減る。「0になったら何が起きるのか」で最後まで引っぱれる
#   2. 進捗トースト（respMemo）… 1カット1記憶。「進捗を達成しました！」なのに
#      体力が減るというねじれがこの型の芯
#   3. 死亡画面（respDeath）… ハートが0で「死んでしまった！」。マイクラ経験者なら
#      1フレームで意味が分かるので、状況説明のテロップが要らない
#   4. リスポーン（respSpawn）… ボタンが押されて白く飛び、ハートが全回復する。
#      「立ち直った」ことを文字で説明せず、回復そのものが合図になる
#   5. 「最終プレイ 1,847日前」… ヘッダに出しっぱなし。最終行の問いかけで回収する
#
# ■ この型は「説明してよい」型
#   ドラマ型だけは物語をリアルだと信じてほしいので画面が説明してはいけないが、
#   この型は最初からマイクラUIのパロディだと分かる茶番なので、
#   常設メーター（ハート）で「あと何回で死ぬのか」を明示してよい。
#   ただし**転換だけは文字で予告・実況しない**。リスポーンの行（id19）には
#   テロップを置かず、ボタン・白飛び・ハートの回復・カラーグレードの反転だけで伝える。
#
# ■ 構造上のルール
#   - 「あるある」はマイクラ一般の記憶であって、よもぎサーバーの話ではない。
#     ここに宣伝を混ぜると釣りが成立しない
#   - 宣伝パート（id20〜26）は全部 docs/yomogi で裏が取れる事実にする
#   - respMemo / respRetort / respFlash / respDeath / respSpawn / respReveal /
#     respResult がある行はテロップが字幕を兼ねるので字幕を出さない。
#     字幕は検索CTA（id27）の行だけ
#   - 死亡画面は id16 で出て id18 まで残る（id17・18 は respDeath を書かない＝
#     持ち越しになり、テロップの下に沈んで背景になる）
#   - 転換の行（id19）は紙芝居ではなく演出に間が要るので pauseAfter を正の値にする
#   - 最終行（id28）は respTone を world に戻し、映像も id1 と同じ src / startFrom に
#     する。色味ごと冒頭に戻るのでループの継ぎ目が消える
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 読みの検証（VOICEVOX audio_query で全行確認ずみ）
#   「開いて」→ ヒラ'イテ ○（アイテ にならない）／「開く」→ ヒラ'ク ○
#   「土に埋まって」→ _ツチ'ニ/ウマッテ' ○／「立たなかった」→ タタ'ナカッタ ○
#   「リスポーンするのだ」→ リ_スポ'オン/スル'/ノダ' ○
#   ただし**「リスポーン地点」は リ'_ス/ポオン'/チ'テン と割れる**ので使わない。
#   id20 は「スポーン地点」（_スポ'オン/チ'テン）に言い換えてある
#
# ■ 情報ソース: docs/yomogi 配下（宣伝パートはすべてここで裏取り）
#   はじめに（docs/yomogi/intro.md）
#     - 統合版・参加費無料・24時間・運営形態はボランティア
#     - 共通の生活ワールドに土地を購入して自分だけの家や店を建築できる
#     - 会社制度で本格的な会社経営が楽しめる
#     - 釣りで釣れる魚は275種類
#     - 車に乗って生活ワールドを駆け回れる
#   近距離VC（docs/yomogi/living/commands/limited-vc.md）
#     - 鯖内で近くにいる人としゃべることができる。距離で音量が変わる
#   会社プラグイン（docs/yomogi/living/commands/company.md）
#     - 会社は運営に申告すれば誰でも無料で設立できる（一定の審査あり）
#
# 素材: public/content/生活サーバー 配下
#   記憶パートは暗い採掘・建築の素材、リスポーン後は明るい昼の街に振り分ける。
#   同じ素材でも RespawnScrim が前半は青く沈め、後半は暖色に起こす
# 効果音: blow3 / shock1 / question1 / solemnity1 / text-impact1 / sceneswitch1 /
#         don-1 / item-get1 / correct1 / anxiety_piano / 決定ボタンを押す1〜4
#         はいずれも効果音ラボ（商用可・クレジット不要）


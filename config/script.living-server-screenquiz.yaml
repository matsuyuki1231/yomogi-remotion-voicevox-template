# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 画面当てクイズ型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「画面当てクイズ型（SCREEN QUIZ）」
#   過去に2つクイズ型を作っている（3択＋カウントダウンリング型 / ○×型。どちらも
#   `config/archive/` に文言だけ残してコンポーネントは削除済み）が、
#   **どちらも設問がテキスト**で、マイクラの映像は後ろに敷いてあるだけだった。
#   この型はそこを壊す。**映像そのものが問題**で、聞くことはほぼ1つ
#   ——「この画面、なにしてる？」。だから画面の中央には何も置かない
#   （`QuizScrim` は上下だけを落として中央を素通しにする）。正解をテキストで
#   教える前に、**同じ素材が続くこと自体が証明**になる。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 2026年の伸びる条件は「参加型の体験設計」＝視聴者が一言いいたくなる余白を作ること
#   2. YouTube に**動画内クイズ機能**（画面上に選択肢ボタンがポップアップして
#      タップで回答する）が入った。選択肢を"押せそうなボタン"で出すのはいま
#      見慣れた形で、説明ゼロで「答えるものだ」と伝わる
#   3. 視聴維持率・完読率が最重要 → 1問2カットで畳みかけ、常設の進捗で残りを見せる
#   4. ループ再生も再生回数に加算される → 最終行の映像を id1 と同じ src / startFrom にする
#
# ■ この型の芯（毎回いちばんありえない選択肢が正解）
#   Q1〜Q6 は**選択肢のうちいちばんありえないものが正解**になる。数問で視聴者が
#   「じゃあ一番ヤバいやつを選べばいいのか」と学習するので後半は当たるようになり、
#   当たること自体が「マイクラでそこまでできる」の証明になる＝遊びと宣伝が同じ動作になる。
#   最終問題（参加費）だけはそのルールを裏切って**いちばんお得な選択肢**が正解。
#
# ■ 視聴維持の装置
#   1. 進捗セグメント＋「n / 6」… **この型の"あと何"メーター**。1問進むごとに1つ埋まる
#   2. 難易度★（quizLevel）… ★1→★5 と上がっていく。演出なので注記で明示する
#   3. 制限時間バー（quizTimer）… 出題行の尺いっぱいで縮む＝答える強制力
#   4. 選択肢ボタン… 出題中はゆっくり脈打ち、解答行で正解が緑に光ってほかが沈む
#   5. 中央の判定スタンプ（quizVerdict）… 正解が斜めに叩き込まれる
#
# ■ 構造上のルール（1問＝出題行＋解答行の2行）
#   - 出題行: quizNo / quizLevel / quizQ / quizChoices / quizAnswer / quizTimer: true
#   - 解答行: 同じ quizQ / quizChoices / quizAnswer に quizShowAnswer: true を足し、
#     quizVerdict（中央スタンプ）と quizFact（根拠）を書く
#   - **quizChoices は出題行・解答行の両方に同じ内容を書く**（2カットにわたって見せるため）
#   - **quizAnswer は 0 始まり**。正解の位置は散らす（毎回同じだと当てずっぽうで当たる）
#   - 出題行と解答行の映像は**同じ素材の連続した位置**にする。映像が続くこと自体が答えの証明になる
#   - 2問ごとにめたんのツッコミ行を挟んでリズムを作る（この行には quizChoices を書かない）
#   - サーバー名は伏せない。id1 で「ここは、よもぎサーバーの生活鯖なのだ」と名乗る
#   - quizHook / quizQ / quizChoices / quizVerdict / quizRetort / quizFlash /
#     quizReveal / quizResult がある行はテロップが字幕を兼ねるので字幕を出さない。
#     字幕は検索CTA（id24）の行だけ
#   - BGMの切替（fromLineId）は最終問題の正解＝トーンが clear になる行（id20）に合わせる
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 出題は全部 docs/yomogi で裏が取れる機能にする（難易度★だけが演出）
#   はじめに（docs/yomogi/intro.md）
#     - 統合版・参加費無料・24時間・運営形態はボランティア
#     - 共通の生活ワールドに土地を購入して自分だけの家や店を建築できる
#     - 会社制度で本格的な会社経営が楽しめる／釣れる魚は275種類／車に乗れる
#   会社プラグイン（docs/yomogi/living/commands/company.md）
#     - 誰でも無料で設立できる（一定の審査あり）。社長は1人、社員の人数に制限なし
#     - /company employees で社員一覧、/company journal で帳簿を見られる
#   チェストショップ（docs/yomogi/living/commands/chest-shop.md）
#     - 保護した土地の中に置ける簡易的な無人販売所。設置は無料
#   土地保護（docs/yomogi/living/commands/land-protection.md）
#     - 有料で土地を購入でき、家・畑・お店などに利用できる
#   近距離VC（docs/yomogi/living/commands/limited-vc.md）
#     - 鯖内で近くにいる人としゃべれる。距離で音量が変わる
#
# 素材: public/content/生活サーバー 配下
#   **この型は素材の中身が問題なので、プラグインのGUIが写っている素材ほど良い**
#   （リスポーン型とは正反対のルール。あちらは「あなたの昔のワールド」の画に
#   ならないので避けたが、こちらは GUI そのものが答えになる）
# 効果音: 決定ボタンを押す2 / question1 / drum-roll1 / correct1 / item-get1 /
#         jajean1 / shock1 / don-1 / spotlight / sceneswitch1 / 決定ボタンを押す4
#         はいずれも効果音ラボ（商用可・クレジット不要）


# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / テレビショッピング・通販型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「テレビショッピング・通販型」（前半でハイテンション→後半で落ち着かせて宣伝）
#   深夜の通販番組の茶番。「本日の商品は、この暮らし、まるごとです」とMC（めたん）が
#   紹介を始め、セット内容（マイホーム・無人店・会社・釣り・車）が1カット1点ずつ
#   積み上がっていく（前半＝ハイテンション）。特典「今ならガチャも付いてくる」で盛り上げ、
#   ドラムロールで値段を引っぱり、「0円」の値段発表スラムで緊張を解く。
#   ここで通販トーンを解除し、正体＝よもぎサーバーの生活サーバーだと明かして
#   検索CTAへ着地する。締めは「お次の商品は、あなたの新生活」でループ。
#
# ■ 視聴維持の装置
#   1. 通販UI（ShopChrome）… 生放送ランプ・紅白のテント柱・ティッカーが常時動き続ける。
#      値段発表以降は赤「生放送」→緑「ご案内」に変わり、画面全体でトーンダウンを見せる
#   2. 値札「お値段 ？？？円」… 常設でぶら下がり続ける。「結局いくらなのか」で
#      最後まで引っぱれる（裁判型の有罪の心証メーターと同じ役割）
#   3. セット内容カウンター＋「セットIN」シール … 1点→6点と弾みながら増えていく。
#      商品プレートが字幕の代わり
#   4. 好奇心ギャップ …「どこの世界の話なのか」を値段発表後のリビールまで明かさない
#
# ■ 構造上のルール
#   - 前半（id1〜8）: shopTone は live。ヘッダは赤、暖色のビネットが脈打つ
#   - 転換（id9）: 値段発表スラム「0円」で shopTone を info に。ここでBGMも切替（defaults.yaml）
#   - リビール（id10）で初めてサーバー名。id11 で機能、id12 で検索CTA
#   - 結果リボン（id13, pauseAfter:0）で冒頭にループ
#   - id1 と id13 は同じ映像・同じ startFrom（ループがつながる）
#   - 字幕は検索CTA（id12）の行だけ。ほかの行は商品プレート・テロップがテロップを兼ねる
#   - shopTicker は全行ぶんを1本に連結して常時流す（Main が集約）
#   - サーバー側の事実（無料・24時間・統合版・土地/家/店/会社/釣り275種/ガチャ/車）は
#     docs/yomogi で裏取り
#
# ■ 情報ソース: docs/yomogi 配下
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 生活ワールドに土地を購入して自分だけの家や店を建てられる（intro.md, land-protection.md）
#   - 会社制度で本格的な会社経営・社員一覧や帳簿がある（intro.md, company.md）
#   - チェストショップ＝無人販売所でアイテムを売れる（intro.md, chest-shop.md）
#   - 釣りで釣れる魚は275種類／ガチャでレアアイテム／車で駆け回れる（intro.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: jajean1 / item-get1 / correct1 / amount-display1 / people-shout-oo2 /
#         text-impact1 / drum-roll1 / don-1 / 決定ボタンを押す4
#         はいずれも効果音ラボ（商用可・クレジット不要）

# ===== フック（0〜3秒。商品発表をいきなり出す）=====
- id: 1
  character: metan
  text: 本日の商品は、この暮らし、まるごとです。
  shopFlash: "この暮らし\nまるごと通販"
  shopFlashSub: 本日の商品
  shopTone: live
  # 値札はフックのテロップとぶつからないよう id2 から出す
  shopTicker: 深夜のテレビ通販 本日の商品は「マイクラの暮らし」まるごとセット
  scene: 1
  pauseAfter: -3
  visual:
    type: video
    src: 生活サーバー/生活ワールドの街並みを散策している動画.mp4
    animation: none
    # 最終行 id13 と同じ位置。ここに戻ってくるのでループがつながる（明るい昼の街）
    startFrom: 3000
  se:
    src: jajean1.mp3
    volume: 0.5


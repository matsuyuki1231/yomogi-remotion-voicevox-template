# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 無限ズーム・入れ子型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「無限ズーム・入れ子型（ZOOM）」よもぎ生活鯖 無限ズーム
#   既存31型はすべて「1行＝1カット」で、セリフが変わるたびに映像が
#   **切り替わって**いた。カードパック開封型で「UIの中に実映像を嵌める」
#   ところまでは行ったが、"カットを切る" という骨格そのものは31型すべて共通。
#   この型はそこを壊す。**映像を1回も切らない**。画面はひとつながりの
#   ズームで、いま映っている画の中央に次の層の窓が開いていて、
#   そこへ潜り込むと次の機能の映像になる。カットの代わりに**深さ**が進む。
#
# ■ この型の芯
#   **「潜っても潜っても、まだある」**。土地 → 家 → チェスト → 店 → 会社 →
#   給料 → 採掘 → 釣り → 車 → 島 → 参加費0円 と、前の層の中から次の層が
#   出てくる入れ子で紹介する。**最下層（参加費0円）の窓の中には、また最初の街**が
#   入っていて、最終フレームが1フレーム目と重なる＝ループの継ぎ目が構造的に消える
#   （設計原則4の極北。ループ層だけ再生速度を逆算して位置まで一致させている）。
#
# ■ 13層の構成（すべて docs/yomogi で裏が取れる）
#    1 生活ワールド … 24時間あそべる生活・経済サーバー（intro）
#    2 自分の土地   … 生活ワールドは 100$/m^2（land-protection）
#    3 自分の家     … 買った土地は本人と共有者だけが編集できる（land-protection）
#    4 チェスト保護 … 自分だけが開ける・すべて無料（chest-protection）
#    5 無人のお店   … 設置は無料・手数料は売上の7%（chest-shop）
#    6 会社の設立   … 無料（審査あり）・社員の人数に制限なし（company）
#    7 給料と帳簿   … 優良企業は事実上の時給5000YG以上（good-standing-company 7.1）
#    8 採掘と役職   … 採掘者はダイヤ鉱石1個で20YG（role）
#    9 釣り         … 釣れる魚は275種類（intro）
#   10 車           … 生活ワールドを駆け回れる（intro）
#   11 近距離VC     … 近くにいる人としゃべれる・距離で音量が変わる（limited-vc）
#   12 自分だけの島 … 作成3,000,000YG・拡張して最大200×200（island）
#   13 参加費0円    … 統合版・参加費無料・24時間（intro / how-to-join）
#   14（ループ層）  … 層1と同じ街。ここで冒頭に戻る
#
# ■ 設計原則との対応
#   1. 冒頭1秒は「転」… 「1カットで、最下層まで」＝この動画自体への予告
#   2. 常設の"あと何"メーター … 深度 1 → 13（最下層まで あと○層）
#   3. 1カット1情報 … 1層＝1機能。しかも**カットは1回も切らない**
#   4. ループ … 最終フレームが1フレーム目と同じ画になる（ループ層）
#   5. 説明してよい型 … 深度計のパロディUIなので画面が明示するのが本体
#   6. ティッカーなし（2026年8月5日の方針）
#   7. コメント誘発 … 「あなたなら、どの層から始める？」
#
# ■ 構造上のルール
#   - zoomSrc を書いた行が新しい層の入口。**その行の頭でその層が全画面になる**
#   - ツッコミだけの行では直前の機能プレートを持ち越す（held。演出は焼き直さない）
#   - 大テロップ・まとめ帯・CTA・ループ層の行ではプレートを畳む
#   - **層の素材は、直前2つの層と重ならないようにする**（3枚同時にマウントされるため）
#   - **ループ層（zoomLoop: true）の素材は層1と同じものにする**。
#     再生速度は「最終フレームで層1の zoomStart に追いつく」ように自動で逆算される
#   - zoomSpec は1行。長いとフォントが縮むので25文字前後まで
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   **セリフでは**金額を 半角数字＋ワイジイ と書く（100ワイジイ → ヒャクワイ'ジイ）。
#   **画面（zoomSpec）は YG のまま書くこと**——プレートは読み上げないので、
#   ここにカタカナ読みを書くと「1マス100ワイジイ」と画面に出てしまう。
#   「300万YG」は サンビャクマンワイ'ジイ で1句。0円は「ゼロエン」。
#   「1カット」はアルファベットが読み飛ばされるので、セリフでは
#   **「カットを切らずに」**と言い換えて、画面のテロップにだけ「1カット」を出す。
#   「275種類」は ニヒャクナナジュウゴ'/シュ'ルイ。
#
# ■ 情報ソース: docs/yomogi 配下（すべて出典つきで画面に出す）
#   はじめに（intro）… 統合版 / 参加費無料 / 24時間 / 釣り275種類 / 車 / 島
#   土地保護（living/commands/land-protection）… 生活ワールドは100$/m^2。
#     購入した土地は購入者と土地共有者だけが編集できる
#   チェスト保護（living/commands/chest-protection）… /clock で自分だけが開ける。
#     すべての機能が無料
#   チェストショップ（living/commands/chest-shop）… 無人販売所。無料設置・
#     収益の7%が手数料
#   会社プラグイン（living/commands/company）… 無料で設立（審査あり）。
#     社長は1人、課長・社員の人数に制限なし
#   公認企業制度（living/supplement/good-standing-company 7.1）…
#     企業は社員の事実上の時給が5000YG以上になるように努めなければならない
#   役職制度（living/commands/role）… 採掘者はダイヤモンド鉱石で20YG
#   近距離VC（living/commands/limited-vc）… 近くにいる人としゃべれる。
#     距離を変化させると音量も自動で変化
#   島プラグイン（living/commands/island）… 作成3,000,000YG。拡張5段階で最大200×200


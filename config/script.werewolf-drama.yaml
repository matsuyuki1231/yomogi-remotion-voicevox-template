# スクリプトデータ（よもぎ マイクラ人狼 宣伝ショート / 縦型ショートドラマ・逆転劇型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「縦型ショートドラマ・逆転劇型」（DramaHud）の人狼版
#   生活サーバー版（config/script.living-server-drama.yaml）と同じ HUD を使う。
#   ただし**ドラマの軸は差し替えてある**。生活サーバー版が「見下し → 立場の逆転」
#   だったのに対し、人狼版は**疑心暗鬼と吊り間違い**でやる。
#   （同じ「ざまぁ」を人狼でやると、勝ち負けの自慢話にしかならず宣伝に着地しない）
#
#   めたんがずんだもんを人狼だと決めつけるところから始まり（id1＝1秒フック）、
#   ずんだもんが弁明するほど疑いの根拠が積まれていく。めたんは迷った末に投票し、
#   処刑してから「本当に霊媒師だった」と知る。**最悪の後味**まで一直線に落とす。
#   そこから「気にしなくていいのだ／疑うのも疑われるのも全部ゲームなのだ」で
#   空気を反転させ、「これ、なんてゲームなの？」＝視聴者の疑問を代弁する形で宣伝へ。
#   締めは「第2話　あなたの番／次は、あなたが疑われる」で冒頭の告発へループする。
#
# ■ 画面が物語を説明してはいけない（生活サーバー版と共通・最重要）
#   逆転が来ることを予告するUI（カウントダウン、シークバーのマーカー）も、
#   「いま逆転しました」と実況するテロップも置かない。転換点（id21）は
#   カラーグレードの反転（青→暖色）・ごく短い白フラッシュ・BGMの切り替えだけで伝える。
#   効果音も「ドン」と決めず、場面に必要な最小限にとどめる。
#
# ■ 視聴維持の装置
#   1. 事実チップ列（dramaFact）… ここでは**疑いの根拠**が積まれる
#      （アリバイなし → 怪しいCO → 目撃者 → 証拠なし → 6票）。
#      逆転後は「その全部が濡れ衣だった」という皮肉として残る
#   2. ヘッダのエピソードタイトル「あなた、人狼でしょ」… 答えの出ていない断定
#   3. シークバー（最下部）… 配信アプリ風の進行表示
#   4. カラーグレード … 前半は冷たい青、逆転後は暖色
#   5. ドラマ字幕 … この型では字幕そのものが主役
#
# ■ 構造上のルール
#   - dramaJab / dramaFlash / dramaReveal / dramaResult がある行は
#     そのテロップが字幕を兼ねるので dramaLine を書かない。それ以外の行には必ず書く
#   - 転換（id21）で dramaTone を turn にする。BGMもここで切り替える
#   - 次回予告リボン（id29, pauseAfter:0）で冒頭にループ。id1 と id29 は同じ映像・同じ startFrom
#   - 登場人物とエピソードはフィクション。id28 の注記で明示する
#
# ■ BGM（config/defaults.yaml の segments をこの版に合わせること）
#   前半: amacha_technophobia（不穏・緊張）volume 0.16 / fromLineId 1
#   後半: amacha_happytime（明るい・解放）volume 0.2 / fromLineId 21
#
# ■ 情報ソース: docs/yomogi/wolf 配下（ゲームの記述はすべてここで裏取り）
#   - 毎週土曜日21:30から開催、参加費無料、統合版（intro.md）
#   - 遊べる役職は41種類（intro.md）
#   - 市民陣営と人狼陣営に分かれ、相手陣営の全滅を目指す（how-to-play/minecraft-wolf.md）
#   - 会議で投票し、最多票のプレイヤーを処刑する（how-to-play/session.md）
#   - CO（自分の役職の宣言）は嘘をつくこともできる（how-to-play/session.md）
#   - 霊媒師は市民陣営の役職（how-to-play/roles.md）
#   - 初めて参加する人でも安心して遊べる（サポートが充実）（intro.md）
#
# 素材: public/content/マイクラ人狼 配下
# 効果音: text-impact1 / 決定ボタンを押す1〜4 / shock1 / item-get1 / question1 /
#         anxiety_piano / don-1 / boom / sceneswitch1 / jajean1
#         はいずれも効果音ラボ（商用可・クレジット不要）


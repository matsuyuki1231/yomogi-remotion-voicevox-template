# スクリプトデータ（よもぎサーバー マイクラ人狼 宣伝ショート / 参加導線ハウツー型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「参加導線ハウツー型（JOIN）」入り方、これだけ ── マイクラ人狼版
#   生活サーバー版（config/script.living-server-join.yaml）と**同じHUD・同じフィールド**のまま、
#   題材だけ差し替えたもの。画面当てクイズ型・縦型ショートドラマ型と同じ転用手順。
#
# ■ 生活サーバー版との決定的な違い: 手順そのものが別物
#   生活サーバーは「アドレスを入れて入るだけ」だが、**人狼はDiscord連携が必須**。
#   そのぶん「面倒くさそう」という障壁が生活サーバーより高いので、
#   この型（手順を最後まで実演して見せる）との相性は人狼のほうがむしろ良い。
#   パネルに映す画面も `discord` / `code` を新設して対応した。
#
#   STEP 1 よもぎサーバーのDiscordに入る
#   STEP 2 #おやくそく-rules で ✅ を押して利用規約に同意する
#   STEP 3 #bot操作-command で「1! new <ゲーマータグ>」とチャットする
#   STEP 4 マイクラで ymgs.f5.si につないで連携コード（8桁）を確認する
#   STEP 5 Discordに戻って「1! auth <連携コード>」と入力する → 連携完了
#   （そのあと、毎週土曜21:30に #マイクラ人狼VC に入るだけ）
#
# ■ サーバーアドレスについて（重要）
#   docs 内で記述が矛盾している。`wolf/how-to-join/join-with-address.md` の本文④だけが
#   「ymg24.org」になっているが、**同じページの「このページの要約」を含む5箇所が
#   `ymgs.f5.si` で一致している**（wolf/faq/device.md、wolf/faq/joining-faults.md
#   「連携時及びイベント参加時に使用するIPアドレス」、wolf/faq/linkage-faults.md
#   「ymg24.org から ymgs.f5.si に変更してください」、living/faq/joining-faults.md
#   「ymgs.f5.si から ymg24.org に変更してください」）。
#   本文④は生活版からのコピペ漏れと判断し、**ymgs.f5.si を採用**（ユーザー確認ずみ）。
#
# ■ 設計原則との対応（生活サーバー版と同じ）
#   1. 冒頭1秒は「転」… 手順動画なのに**結論（もう入れた画）から始める**。
#      id1 だけトーンが inside なので映像がぼけない
#   2. 常設の"あと何"メーター … 前半は STEPバー（1→5）、後半はやったことチップ。
#      **経過時間カウンターは演出ではなく動画の実経過時間**（id3 で開始、id14 で停止）
#   3. 1カット1情報 … 1行1手順。すべて docs/yomogi/wolf で裏が取れる
#   4. ループ … 最終行の映像を id1 と同じ src / startFrom にする
#   5. コメント誘発 …「役職、なにがいい？」
#   6. 余白ゼロ … 最終行の pauseAfter は 0
#
# ■ 素材の制約
#   マイクラ人狼で実在する動画素材は4本だけ（会議中の風景 / 会議中の風景2 /
#   殺し屋が霊媒師のフリ / 霊媒師で市民勝利）。生活サーバー版の29行に対して
#   **25行に抑えて**使い回しの目立ちを減らしている。
#   - 前半（setup）は暗幕＋blurで沈むので使い回しが目立たない
#   - **いちばん明るいのは「殺し屋が霊媒師のフリ」の f24〜213**（一人称視点の
#     人狼HUD＝役職表示が右に映る）。連携完了スラム（id14）と役職の行（id20）に当てた
#   - id1 と最終行（ループの継ぎ目）は「会議中の風景2」の f120（明るい屋外に
#     プレイヤーが集まっている画＝イベントの絵）
#   - 「会議中の風景2」の f≈390 前後はカメラが黒い人物に塞がれるので使わない
#   - 会議の行（id18）は「会議中の風景」の赤い屋内＝実際の会議場
#
# ■ 事実の裏取り（docs/yomogi/wolf 配下）
#   参加方法（wolf/how-to-join/index.md）
#     - 事前準備: Discordアカウント / Minecraft統合版（Java版不可）
#     - 13歳以上であること、Minecraftを起動しながらDiscordのVCに参加できること（聞き専可）
#     - ①Discordに参加 →②#おやくそく-rules で✅→③1! new / 1! auth で連携
#       →④21:30に #マイクラ人狼VC に参加
#     - 連携コードは8桁。半角数字か半角英小文字（0と1はあるが l と o はない）
#     - イベント開始時にルール説明があるので、21:30から参加なら未学習でも参加できる
#   サーバーアドレス（wolf/how-to-join/join-with-address.md ほか）… ymgs.f5.si / 19132
#   フレンド追加（wolf/how-to-join/join-with-friend.md）… ymg24mc
#   役職（wolf/supplement/all_roles.md）… 2026年7月19日時点で47種類
#     ※ intro.md には41種類とあるが、日付つきで新しい all_roles.md を採用（既存の人狼版と同じ）
#   はじめに（intro.md）… 毎週土曜21:30 / 参加費無料 / 会議と投票＋弓や狙撃銃でPvP
#   近距離VC（wolf/faq/lvc-unused.md）… **Basic人狼では使わない**ので謳わない


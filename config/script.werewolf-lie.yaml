# スクリプトデータ（よもぎサーバー マイクラ人狼 宣伝ショート / ウソ発見器・ウソ当て型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「ウソ発見器・ウソ当て型（LIE）」マイクラ人狼版
#   生活サーバー版（config/script.living-server-lie.yaml）と**同じHUD・同じフィールド**
#   （`lie*` + `LieHud`）のまま題材だけ差し替えた転用。
#
#   **3枚のうち1枚だけがウソで、残り2枚は本当**。捨て札が消えるので1問で2件紹介でき、
#   解説パネルでウソを否定するときに3件目が出る。全8問で **本当のことが24件** 乗る。
#
# ■ 人狼版がこの型と相性がいい理由
#   マイクラ人狼は**ルールの説明量が多い**（会議・投票・CO・タスク・サボタージュ・
#   役職47種）。ふつうの紹介動画だと「毎週土曜21:30にやってます」で終わってしまい、
#   中身が1つも伝わらない。この型なら**ルールそのものをクイズの本体にできる**ので、
#   遊び方を教えることと宣伝が同じ動作になる。
#
#   さらに人狼は**「ウソをつくゲーム」そのもの**なので、ウソ発見器という枠が題材と
#   噛み合う。第3問（CO）の答えが「COでウソをつける」なのが象徴的で、
#   ウソを見破らせる動画で「このゲームはウソをついていい」と教えることになる。
#
# ■ この型の芯（生活サーバー版と同じ）
#   **「ウソくさいほうが、本当だった」**。ウソ札は「味方は撃てない」「COでウソはつけない」
#   「市民しか解けない」のような *いかにも制限がありそうな話* にし、逆に
#   「壁をつらぬく銃がある」「死んだ人が生き返る」のような *ありえない話* を本当にした。
#
#   最終問題（参加費・毎週土曜21:30・初参加OK）だけはルールを裏切って **ウソが1枚もない**。
#   残るウソが id19 で 0 になった直後に第8問が来るのが、この型いちばんの仕掛け。
#
# ■ 素材の制約（人狼版で最も効く）
#   **人狼で実在する動画素材は4本だけ**（会議中の風景 / 会議中の風景2 /
#   殺し屋が霊媒師のフリ / 霊媒師で市民勝利）。生活サーバー版の31行に対して
#   **29行に抑えて**使い回しの目立ちを減らし、同じカットの再利用は必ず8行以上あける。
#   コンタクトシートで確認した使える区間は以下の通り:
#     会議中の風景.mp4（360f）      … 30 / 90 / 150 / 210（暗い会議場。終端側は尺が足りない）
#     会議中の風景2.mp4（456f）     … 30 / 90 / 150 / 250（明るい昼。**f≈210 と f≈390 は
#                                     黒い人物がカメラを塞ぐ**ので避ける）
#     殺し屋が霊媒師のフリ.mp4（450f）… 30 / 90 / 150（一人称視点＋右上に役職表示。
#                                     **f≈270 以降はチャット欄が全面に開く**ので使わない）
#     霊媒師で市民勝利.mp4（450f）  … 150 / 210 / 270 / 320（**f≈120 以前はチャット欄**）
#
# ■ 読みの注意（VOICEVOX の audio_query で確認ずみ）
#   **「マイクラ人狼」は マイクラ'ジン/オ'オカミ と誤読される**ので
#   セリフでは **`マイクラジンロウ`** とカタカナで書く（`displayText` は漢字のまま）。
#   問番号は「第2問」〜「第6問」「第8問」を**カタカナ**（`ダイニモン`〜`ダイハチモン`）、
#   「第1問」「第7問」を**ひらがな**（`だいいちもん` / `だいななもん`）。
#   「24コ」は ジュウ'/ハチ'コ と割れるので**カタカナ**（`ニジュウヨンコ`）。
#   「47種類」「21時半」「一撃弓」「同数票」はカードとテロップにだけ出し、
#   **セリフでは読ませない**（アルファベットと数字の誤読を避ける）。
#
# ■ 情報ソース: docs/yomogi/wolf 配下（すべて出典つきで画面に出す）
#   マイクラ人狼（wolf/how-to-play/minecraft-wolf）… 一撃弓は全員に配布、矢はスポーン地点に
#     50秒に1度発生、フレンドリーファイア有効（同じ陣営も倒せる）
#   会議（wolf/how-to-play/session）… 中央のボタンで開始、会議中は攻撃できない、
#     同数票なら誰も処刑されない、投票先は処刑時に全員へ公表、レンガ（COカード）でCO、
#     COでは嘘をつける、COの一覧は画面左下に表示
#   役職（wolf/how-to-play/roles、wolf/supplement/all_roles）… 2026年7月19日時点で47種類。
#     占い師は生きている1人、霊媒師は死んでいる1人（どちらもゲーム中一度だけ）。
#     死神は死亡者を一度だけ復活させられる（退出者は不可）。狙撃手は壁を貫通する銃。
#     人狼陣営には仲間（狂信者を除く）が表示される
#   タスク（wolf/how-to-play/task）… 4か所、20秒スニークで解決、参加者全員が解決できる、
#     手に物を持っていると解決不可、「市民」役職だけ2倍速の10秒
#   サボタージュ（wolf/how-to-play/sabotage）… 人狼陣営が発動、4か所のうち2か所が赤くなる、
#     60秒以内に解除しないと市民陣営の敗北、解除は参加者なら誰でも可、
#     解除後に解除者からランダムで1人へ特殊アイテム
#   チャット（wolf/how-to-play/chat）… 会議以外のチャットは半径10m、死者の声は生存者に届かない
#   参加方法（wolf/how-to-join、intro）… 毎週土曜21:30、統合版、参加費0円、
#     21:30から参加すれば主催者が口頭でルール説明を行う。Discord連携が必要


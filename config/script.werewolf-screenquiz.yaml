# スクリプトデータ（よもぎ マイクラ人狼 宣伝ショート / 画面当てクイズ型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「画面当てクイズ型（SCREEN QUIZ）」の人狼版
#   生活サーバー版（config/script.living-server-screenquiz.yaml）と同じ HUD を使う。
#   **映像そのものが問題**で、聞くことはほぼ1つ——「この画面、なにしてる？」。
#   人狼素材は4本しかないが、「殺し屋が霊媒師のフリ.mp4」と「霊媒師で市民勝利.mp4」に
#   人狼専用HUD（役職表示・役職一覧・COログ・キル表示）がそのまま写っており、
#   GUIが答えになるこの型とは相性がいい。
#
# ■ この型の芯（毎回いちばんありえない選択肢が正解）は人狼版でも維持する
#   Q1〜Q5 は**いちばん物騒な選択肢が正解**（犯人を探す会議／誰かが殺された／
#   47種類／人狼の殺し屋／投票で処刑）。数問で「一番ヤバいやつが正解」と学習させ、
#   当たること自体が「マイクラでそこまでやってる」の証明になる。
#   最終問題（参加費）だけルールを裏切って**いちばんお得な選択肢**が正解。
#
# ■ 構造上のルール（生活サーバー版と共通）
#   - 1問＝出題行＋解答行の2行。quizChoices は両方に同じ内容を書く
#   - quizAnswer は 0 始まり。正解の位置は散らす（この版: 1,0,2,1,0,2）
#   - 出題行と解答行の映像は同じ素材の連続した位置（映像が続くこと自体が証明）
#   - 2問ごとにめたんのツッコミを挟む
#   - サーバー名は伏せない。id1 で「よもぎサーバーのマイクラ人狼」と名乗る
#   - 字幕は検索CTA（id20）の行だけ
#   - BGMの切替（fromLineId）は最終問題の正解＝トーンが clear になる行（id17）
#
# ■ 出題は全部 docs/yomogi/wolf で裏が取れる事実にする（難易度★だけが演出）
#   - 誰が人狼かをみんなで推理しあう「会議」がある（how-to-play/minecraft-wolf.md）
#   - 一撃弓などでステージ上のプレイヤーを倒せる（how-to-play/minecraft-wolf.md）
#   - 役職は47種類（supplement/all_roles.md「2026年7月19日時点で47つ」。
#     intro.md には41種類とあるが、日付つきで新しい役職一覧ページの数を採用）
#   - CO（役職の宣言）は嘘をつくこともできる（how-to-play/session.md）
#   - 会議では投票で最多票のプレイヤーが処刑される（how-to-play/session.md）
#   - 毎週土曜日21:30開催・参加費無料・統合版・サポート充実で初参加でも安心（intro.md）
#
# ■ 素材: public/content/マイクラ人狼 配下の4本のみ（コンタクトシートで中身を確認済み）
#   - 殺し屋が霊媒師のフリ.mp4（450f）: f0〜240 一人称＋人狼HUD（右上に「殺し屋」、
#     f0〜90 に赤いキル表示「◯◯を殺した」）。f270〜 チャット全画面
#     （「怪盗はどうゆう能力だっけ？」に答えてもらっている＝初心者歓迎の画）
#   - 霊媒師で市民勝利.mp4（450f）: f0〜150 チャット全画面（「見間違え」「マジの見間違え」）。
#     f180〜 霊媒師視点の明るい村＋役職一覧（サイコ・てるてる等の変わり役職も見える）
#   - 会議中の風景.mp4（360f）: 暗い雨のステージに全員集合（処刑の空気）
#   - 会議中の風景2.mp4（456f）: 昼の広場に人だかり。f390 付近はカメラが黒い人物に
#     塞がれるので出題カットに使わない
# 効果音: 生活サーバー版と同じ（効果音ラボ・商用可・クレジット不要）


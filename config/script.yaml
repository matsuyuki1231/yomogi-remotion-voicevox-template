# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 緊急速報・報道型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「緊急速報・報道型」（前半で緊張→後半で落ち着かせて宣伝）
#   「【速報】マイクラの中に謎の巨大都市が出現」というニュース速報として始まる。
#   スタジオのキャスター（めたん）と現場リポーター（ずんだもん）が中継で騒ぎ、
#   道路・車・営業中の店・畑・会社と"生活の痕跡"が次々見つかっていく（前半＝緊張・茶番）。
#   「住民の正体が判明」で引っぱったあと、正体は全員プレイヤー＝よもぎサーバーの
#   生活サーバーだったと判明。速報トーンを解除して穏やかに機能紹介＋検索CTAへ着地する。
#   締めは「次の住民は、あなた」でループ。
#
# ■ 視聴維持の装置
#   1. 報道UI（NewsChrome）… 速報ヘッダ帯・流れるティッカー・走査線が常時動き続ける。
#      リビール以降は赤「速報」→緑「お知らせ」に変わり、画面全体でトーンダウンを見せる
#   2. 下部ニューススーパー（LowerThird）… 1カット1本、左からワイプで入る。字幕の代わり
#   3. LIVE中継バッジ・専門家プレート・続報スタンプ … 報道の"それっぽさ"で茶番を成立させる
#   4. 好奇心ギャップ …「住民は誰なのか」が正体リビールまで引っぱる
#
# ■ 構造上のルール
#   - 前半（id1〜7）: newsTone は breaking。速報帯は赤、走査線あり
#   - 転換（id8）: newsTone を calm に。ここでBGMも不穏→温かいに切替（defaults.yaml）
#   - リビール（id9）で初めてサーバー名。id10〜12 で機能と「0円・24時間」を穏やかに置く
#   - CTA（id13）→ 結果リボン（id14, pauseAfter:0）で冒頭にループ
#   - id1 と id14 は同じ映像・同じ startFrom（ループがつながる）
#   - 字幕は検索CTA（id13）の行だけ。ほかの行はニューススーパーがテロップを兼ねる
#   - newsTicker は全行ぶんを1本のティッカーに連結して常時流す（Main が集約）
#   - サーバー側の事実（無料・24時間・統合版・土地/家/店/会社/釣り275種/車）は docs/yomogi で裏取り
#
# ■ 情報ソース: docs/yomogi 配下
#   - 参加費無料・統合版のみ・24時間あそべる生活/経済サーバー（intro.md）
#   - 生活ワールドに土地を購入して自分だけの家や店を建てられる（intro.md）
#   - チェストショップで販売できる／会社経営ができる（intro.md, company.md）
#   - 釣りで釣れる魚は275種類／車に乗って生活ワールドを駆け回れる（intro.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/生活サーバー 配下
# 効果音: emergency-alert1 / news-title1〜3 / text-impact1 / drum-roll1 / boom / jajean1 /
#         item-get1 / 決定ボタンを押す* は効果音ラボ（商用可・クレジット不要）

# ===== フック（0〜3秒。ニュース速報として始める）=====

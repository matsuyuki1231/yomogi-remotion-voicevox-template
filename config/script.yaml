# スクリプトデータ（よもぎ生活サーバー 宣伝ショート / 巻き戻し型）
# セリフを編集後、npm run sync-script → npm run voices の順で反映
#
# ■ フォーマット: 「巻き戻し型（REWIND）」DAY 365 → DAY 1
#   これまでの型はすべて時間が**前へ**進む。事実・証拠・商品・質問・記憶が
#   1カットずつ積み上がってメーターが動き、結末へ向かう構造だった。
#   この型は時間そのものを**逆に流す**。DAY 365（完成した暮らし）から
#   DAY 1（なにも持っていない日）へ遡り、そのあいだ持ち物のチップが
#   1つずつ画面から消えていく。
#
# ■ この型を作った根拠（2026年のショート動画トレンド調査）
#   1. 伸びる企画の型として「ビフォーアフター型」「裏側・制作過程型（タイムラプス）」が
#      名指しされており、どちらも定石は**完成品を最初に見せてから過程に戻る**こと。
#      この型はその構造そのもの（既存21型は一度も時間経過軸を使っていない）
#   2. Shortsの平均視聴時間が45秒→58秒に伸び、45〜75秒の高情報密度が優遇される
#      → 1カット1日で28カット
#   3. ループ再生も再生回数に加算される → 最終行で DAY を 365 に戻し、
#      映像も id1 と同じ src / startFrom にする。時間が円環になって継ぎ目が消える
#   4. 冒頭1秒は「起」ではなく「転」→ 前置きゼロで「ぜんぶ持ってる」＋「年収0円」の矛盾
#   5. コメント誘発を構造に埋める → 最終行「あなたのDAY 1は？」
#
# ■ 宣伝としてなぜ正しいか
#   「すごい人の自慢」で終わらせず、**DAY 1 まで遡って全部剥がしきる**。
#   なにも持っていない画（持ち物なし）をいちばん大きく見せてから、
#   「1年前は、だれでもここ」→「ここから始められる」に着地する。
#   宣伝が"到達点"ではなく"出発点"として出るので押し売りにならない。
#   剥がしたチップが宣伝パートで同じ順に積み直るのも、
#   「あなたも同じ順で手に入る」を文字で言わずに伝えるための仕掛け。
#
# ■ 視聴維持の装置
#   1. DAYカウンター（rwDay）… **この型の"あと何"メーター**。365 → 1 へ減っていき、
#      数字が転がって着地する。右端の縦レールでつまみが上から下へ降りる
#   2. 持ち物チップ（rwGot）… 遡るたびに赤く光って打ち消し線が入り、右へはじけ飛ぶ。
#      8個 → 0個。「なにも無くなる」ことを文字で説明せずに見せる
#   3. 記録カード（rwLog）… 1カット1日。上から滑り込んで前のカードを押しのける
#   4. VHSのトラッキングノイズ … 巻き戻し中だけ走査線と横帯が走る。
#      「いま逆再生している」ことを文字で説明せずに済ませる層
#   5. 逆向きに流れる記録メモ帯 … ほかの型のティッカーは右→左だが、この型は左→右
#
# ■ この型は「説明してよい」型
#   ドラマ型だけは物語をリアルだと信じてほしいので画面が説明してはいけないが、
#   この型は最初から巻き戻しプレイヤーのパロディUIだと分かる茶番なので、
#   常設メーター（DAYカウンター＋縦レール）で「あと何日で0になるのか」を
#   明示してよい。ただし**「ここから宣伝です」「立場が変わりました」の類は書かない**。
#   転換（id20）はトーンの反転（青→緑）とチップが積み直り始めることだけで伝える。
#
# ■ 構造上のルール
#   - チップは巻き戻しで8個ぜんぶ剥がす（車→会社→店→家→土地→釣り竿→仲間→ツルハシ）。
#     id16 で持ち物ゼロになり、その状態で id17 の DAY 1 スラムが出る
#   - 宣伝パートで積み直すのは5個（土地→家→店→会社→車）。剥がした順の逆に戻る
#   - 最終行（id29）は rwTone を now に戻し、rwDay を 365 に戻す。
#     チップは Main 側が「一度 start に入ったら積み上げたまま」に解決するので、
#     ループの継ぎ目でも持ち物は5個のまま割れない
#   - **サーバー名は伏せない**。この型の引っぱりはDAYカウンターと剥がれていく
#     チップが担うので、名前を隠す必要がない。id4 で「ここは、よもぎサーバーの
#     生活鯖なのだ」と言い切ってしまう（コメント返信型と同じ考え方）。
#     id20 のリビール帯は正体明かしではなく、宣伝への転換点の合図として残す
#   - 記録の中身は全部 docs/yomogi で裏が取れる機能にする。
#     日付と人物はフィクションなので rwNote で明示する
#   - rwLog / rwRetort / rwFlash / rwOrigin / rwReveal / rwResult がある行は
#     テロップが字幕を兼ねるので字幕を出さない。字幕は検索CTA（id28）の行だけ
#   - 転換の行（id5 / id17 / id20）は演出に間が要るので pauseAfter を正の値にする
#   - startFrom は素材の長さ（public/content/video-durations.json）を超えないこと
#
# ■ 情報ソース: docs/yomogi 配下（記録・宣伝パートはすべてここで裏取り）
#   はじめに（docs/yomogi/intro.md）
#     - 統合版・参加費無料・24時間・運営形態はボランティア
#     - 共通の生活ワールドに土地を購入して自分だけの家や店を建築できる
#     - 会社制度で本格的な会社経営が楽しめる
#     - 釣りで釣れる魚は275種類
#     - 車に乗って生活ワールドを駆け回れる
#   土地保護（docs/yomogi/living/commands/land-protection.md）
#     - 有料で土地を購入でき、家・畑・お店などに利用できる
#   チェストショップ（docs/yomogi/living/commands/chest-shop.md）
#     - 保護した土地の中に置ける簡易的な無人販売所
#   会社プラグイン（docs/yomogi/living/commands/company.md）
#     - 誰でも無料で設立できる（一定の審査あり）。社長は1人、社員の人数に制限なし
#   近距離VC（docs/yomogi/living/commands/limited-vc.md）
#     - 鯖内で近くにいる人としゃべれる。距離で音量が変わる
#
# 素材: public/content/生活サーバー 配下
#   巻き戻しが進むほど暗く・原始的な素材へ寄せる（街 → 店 → 建築 → 土地 → 採掘）。
#   同じ素材でも RewindScrim が巻き戻し中は青く沈め、出発点では緑に起こす
# 効果音: text-impact1 / text-impact3 / shock1 / question1 / sceneswitch1 /
#         blow3 / solemnity1 / don-1 / item-get1 / correct1 / anxiety_piano /
#         決定ボタンを押す1〜4 はいずれも効果音ラボ（商用可・クレジット不要）


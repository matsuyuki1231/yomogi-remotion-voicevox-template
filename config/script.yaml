# スクリプトデータ（よもぎマイクラ人狼 宣伝ショート / 緊急速報・報道型）
# 反映方法: このファイルを config/script.yaml にコピー → npm run sync-script → npm run voices → npm run build
#           （生活サーバー版に戻すときは git から config/script.yaml を復元して npm run voices をやり直す）
#
# ■ フォーマット: 「緊急速報・報道型」（生活サーバー版と同じ NewsHud を人狼に適用）
#   「【速報】毎週土曜の夜、住民が次々と消える村がある」という連続失踪事件の速報として始まる。
#   スタジオのキャスター（めたん）と現場リポーター（ずんだもん）が中継で騒ぎ、全員が弓を持ち、
#   一か所に集められ、生存者が減っていく……と事件性を積む（前半＝緊張・茶番）。
#   「事件の全容が判明」で引っぱったあと、全員ゲームで遊んでいるだけ＝よもぎサーバーの
#   マイクラ人狼イベントだったと判明。速報トーンを解除して穏やかにイベント紹介＋検索CTAへ着地する。
#   締めは「次に消えるのは、あなた」でループ（冒頭の"消える村"に戻る）。
#
# ■ 構造上のルール（生活サーバー版と共通）
#   - 前半（id1〜7）: newsTone は breaking。速報帯は赤、走査線あり。サーバー名は出さない
#   - 転換（id8）: newsTone を calm に。ここでBGMも不穏→温かいに切替（defaults.yaml）
#   - リビール（id9）で初めてサーバー名。id10〜12 で役職41種類・毎週土曜21:30・0円・初心者歓迎
#   - CTA（id13）→ 結果リボン（id14, pauseAfter:0）で冒頭にループ
#   - id1 と id14 は同じ映像・同じ startFrom（ループがつながる）
#   - 冒頭の行にはSEを入れない（再生直後に警報音が鳴ると印象が悪い）
#   - 字幕は検索CTA（id13）の行だけ。ほかの行はニューススーパーがテロップを兼ねる
#   - 報道UIの時計は21:47始まり。人狼イベント（毎週土曜21:30〜）の時間帯とちょうど噛み合う
#
# ■ 情報ソース: docs/yomogi/wolf 配下 ＋ docs/yomogi/intro.md
#   - 毎週土曜日の21:30から開催（金曜・祝日前日に臨時開催あり）（minecraft-wolf.md / event-administer.md）
#   - 統合版マイクラを持っていれば誰でも無料で参加できる（intro.md, event-administer.md）
#   - 遊べる役職は41種類（intro.md）
#   - 一撃弓＝当てた相手を一撃で倒せる弓が全員に配られる（minecraft-wolf.md）
#   - ステージ上のボタンを押すと「会議」が始まり、会議中は攻撃できない（minecraft-wolf.md）
#   - 主催者や他の参加者のサポートが充実しており初参加でも安心（intro.md）
#   - 運営形態はボランティア（intro.md）
#
# 素材: public/content/マイクラ人狼 配下
# 効果音: news-title1〜3 / text-impact1 / anxiety_piano / drum-roll1 / boom / jajean1 /
#         item-get1 / 決定ボタンを押す* は効果音ラボ（商用可・クレジット不要）

# ===== フック（0〜3秒。連続失踪事件の速報として始める。SEは入れない）=====
